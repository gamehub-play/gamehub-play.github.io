.bs-led circle { fill:var(--lc); opacity:.25; animation:bs-chase 1.1s linear infinite; filter:drop-shadow(0 0 3px var(--lc)); }

.bs-top .bs-mini { padding:4px 9px; font-size:12px; }
.bs-night { background:linear-gradient(#0d0830 0%,#2a0f55 62%,#10062a 100%); border-radius:16px; padding:6px 4px 14px; position:relative; overflow:hidden; box-shadow:inset 0 0 0 2px #7c3aed55; }
.bs-night .bs-sub { color:#d8c9ff; }

  background:
    linear-gradient(#22d3ee,#22d3ee) 6% 14px/3px 22px no-repeat, linear-gradient(#ff4fd8,#ff4fd8) 21% 6px/22px 3px no-repeat,
    linear-gradient(#a3e635,#a3e635) 38% 18px/3px 26px no-repeat, linear-gradient(#fb923c,#fb923c) 55% 10px/26px 3px no-repeat,
    linear-gradient(#ff4fd8,#ff4fd8) 72% 12px/3px 30px no-repeat, linear-gradient(#22d3ee,#22d3ee) 90% 8px/24px 3px no-repeat,

@keyframes bs-sky { to { filter:drop-shadow(0 0 9px #22d3ee); } }
.bs-night::after { content:''; position:absolute; left:0; right:0; bottom:0; height:10px; background:repeating-linear-gradient(90deg,#fde68a 0 18px,transparent 18px 38px) 0 4px/200% 2px no-repeat,#15092f; animation:bs-road 1s linear infinite; pointer-events:none; }
@keyframes bs-road { to { background-position:-76px 4px,0 0; } }
.bs-night .bd-bus { position:relative; z-index:1; filter:drop-shadow(0 0 7px var(--glow,#a855f7)) drop-shadow(0 0 16px var(--glow,#a855f7)); }
.bs-night .bs-stars span.off { color:#4a3d70; }
.bs-bump { animation:bs-bump .38s ease-out; } @keyframes bs-bump { 30% { transform:translateY(-5px) scale(1.012,.985); } 60% { transform:translateY(1px) scale(.994,1.01); } }

.bs-ri { display:flex; gap:6px; align-items:center; background:#fbf0cf; border:2px solid #3b3a4a; border-radius:10px; padding:3px 6px; opacity:0; animation:bs-rin .35s forwards; }

.bs-tkpanel { text-align:center; margin:6px 0; font-weight:800; font-size:13px; }
.bs-task { display:block; margin:2px 0; border:0; border-radius:8px; padding:3px 8px; font:inherit; font-size:11px; font-weight:900; cursor:pointer; color:#fff; background:#6366f1; }
.bs-task.mu { background:#db2777; }
.bs-roadev { position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; gap:10px; align-items:center; background:#b91c1c; color:#fff; font-weight:900; padding:8px 14px; border-radius:14px; box-shadow:0 6px 20px #0009; animation:bs-evin .3s ease-out; }
.bs-roadev b { background:#facc15; color:#111; border-radius:10px; padding:5px 12px; cursor:pointer; }
.bs-roadev i { font-style:normal; background:#0006; border-radius:50%; width:24px; height:24px; display:grid; place-items:center; }
@keyframes bs-evin { from { opacity:0; transform:translate(-50%,-14px); } to { opacity:1; transform:translate(-50%,0); } }
.bs-task.ar{background:#dc2626;color:#fff}
.bs-arg{position:fixed;inset:0;z-index:80;background:rgba(10,10,20,.6);display:flex;align-items:center;justify-content:center;}
.bs-arg-b{width:min(340px,92%);background:#fffaf0;border:4px solid #2b2b2b;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.bs-arg-q{font-weight:900;font-size:17px;text-align:center;color:#7f1d1d;background:#fee2e2;border-radius:12px;padding:10px}
.bs-arg-b button{font:inherit;font-weight:800;font-size:14px;padding:10px;border-radius:12px;border:3px solid #2b2b2b;background:#fde68a;color:#2b2b2b;cursor:pointer}
.bs-arg-b button.bad{background:#e5e7eb;opacity:.5}
.bs-riv{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#7f1d1d;margin:0 6px 6px}
.bs-riv div{flex:1;height:10px;border-radius:6px;background:#fee2e2;border:2px solid #2b2b2b;overflow:hidden}
.bs-riv i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f87171,#dc2626);transform-origin:right;animation:bs-riv linear forwards}

\u0647\u0627":"\u{1F30A} The lake is in the middle: you must go around it","\u0634\u0643\u0644 \u0627\u0644\u062E\u0631\u064A\u0637\u0629 (\u0644\u064A\u0643 \u0627\u0646\u062A \u0628\u0633)":"Map look (only for you)","\u0634\u0643\u0644 \u0627\u0644\u062E\u0631\u064A\u0637\u0629":"Map look",\u0639\u0627\u062F\u064A\u0629:"Default",\u0641\u0636\u0627\u0621:"Space",\u0645\u062F\u064A\u0646\u0629:"City",\u0628\u062D\u0631:"Sea",\u0634\u0627\u0637\u0626:"Beach",\u063A\u0627\u0628\u0629:"Forest","\u2022 \u0645\u0631\u0628\u0639 \u0627\u0644\u062D\u0638 \u2728 \u0628\u064A\u0638\u0647\u0631 \u0641\u064A \u0627\u0644\u0646\u0635 \u0628\u0639\u062F \u0634\u0648\u064A\u0629: \u0627\u0644\u0644\u064A \u064A\u0648\u0635\u0644\u0647 \u0627\u0644\u0623\u0648\u0644 \u064A\u0627\u062E\u062F \u0642\u062F\u0631\u0629 \u064A\u062E\u0632\u0646\u0647\u0627 \u0648\u064A\u0633\u062A\u062E\u062F\u0645\u0647\u0627 \u0648\u0642\u062A \u0645\u0627 \u064A\u062D\u0628.":"\u2022 The lucky square \u2728 appears in the middle after a while: whoever reaches it first gets a power to store and use whenever they like.","\u2022 \u0643\u0644 \u0645\u0627 \u062A\u0643\u0633\u0628 \u0628\u062A\u0627\u062E\u062F \u0639\u0645\u0644\u0627\u062A \u{1FA99} \u062A\u0641\u062A\u062D \u0628\u064A\u0647\u0627 \u0634\u062E\u0635\u064A\u0627\u062A \u0648\u0623\u0644\u0648\u0627\u0646 \u0648\u0623\u0634\u0643\u0627\u0644 \u0641\u064A \u0627\u0644\u0645\u062A\u062C\u0631.":"\u2022 Every game earns coins \u{1FA99} to unlock characters, colors and shapes in the shop.","\u0627\u0644\u0639\u0628 \u0645\u0639 \u0635\u0627\u062D\u0628\u0643\u060C \u0643\u0644 \u0648\u0627\u062D\u062F \u0639\u0644\u0649 \u0645\u0648\u0628\u0627\u064A\u0644\u0647\u060C \u0628\u0643\u0648\u062F \u063A\u0631\u0641\u0629. \u0641\u064A\u0647 \u0634\u0627\u062A \u0648\u0645\u064A\u0643 \u0643\u0645\u0627\u0646 \u{1F4AC}\u{1F3A4}":"Play with a friend, each on their own phone, using a room code. Chat and mic included \u{1F4AC}\u{1F3A4}","\u2022 \u0641\u064A \u0623\u0648\u0644 \u0643\u0644 \u0644\u0639\u0628\u0629 \u0628\u062A\u062E\u062A\u0627\u0631 \u0642\u062F\u0631\u0629 \u0645\u0646 \u0627\u062A\u0646\u064A\u0646\u060C \u0648\u0643\u0644 \u062F\u0648\u0631 \u0644\u064A\u0647 \u0648\u0642\u062A \u0645\u062D\u062F\u062F \u23F1\uFE0F.":"\u2022 At the start of every game you pick one of two powers, and every turn has a time limit \u23F1\uFE0F.","\u2022 \u0627\u0644\u062D\u0627\u062C\u0632 \u0645\u0645\u0646\u0648\u0639 \u064A\u0642\u0641\u0644 \u0627\u0644\u0637\u0631\u064A\u0642 \u062A\u0645\u0627\u0645\u064B\u0627\u060C \u0644\u0627\u0632\u0645 \u064A\u0641\u0636\u0644 \u0641\u064A \u0637\u0631\u064A\u0642 \u0645\u0641\u062A\u0648\u062D.":"\u2022 A barrier may never fully block the way; an open path must always remain.","\u0627\u0644\u062D\u0627\u062C\u0632 \u0628\u064A\u062A\u062D\u0637 \u0628\u0627\u0644\u0638\u0628\u0637 \u0639\u0646\u062F \u0627\u0644\u0646\u0642\u0637\u0629 \u0627\u0644\u0645\u0636\u064A\u0626\u0629\u060C \u062D\u0631\u0643 \u0635\u0628\u0627\u0639\u0643 \u0648\u0627\u0631\u0641\u0639\u0647 \u{1F3AF}":"The barrier lands exactly on the glowing dot. Slide your finger and lift \u{1F3AF}","\u0645\u0641\u064A\u0634 \u0625\u0630\u0646 \u0644\u0644\u0645\u064A\u0643. \u0641\u0639\u0651\u0644\u0647 \u0645\u0646 \u0625\u0639\u062F\u0627\u062F\u0627\u062A \u0627\u0644\u0645\u062A\u0635\u0641\u062D/\u0627\u0644\u0645\u0648\u0642\u0639 \u0648\u062C\u0631\u0628 \u062A\u0627\u0646\u064A":"No mic permission. Enable it in the browser/site settings and try again","\u0627\u0644\u0645\u064A\u0643 \u0634\u063A\u0627\u0644 \u{1F399}\uFE0F \u0635\u0627\u062D\u0628\u0643 \u0644\u0627\u0632\u0645 \u064A\u0641\u062A\u062D \u0627\u0644\u0645\u064A\u0643 \u0643\u0645\u0627\u0646 \u0639\u0634\u0627\u0646 \u062A\u0633\u0645\u0639\u0648\u0627 \u0628\u0639\u0636":"Mic is on \u{1F399}\uFE0F your friend must open their mic too so you can hear each other","\u{1F32B}\uFE0F \u0634\u0627\u064A\u0641 \u062D\u0648\u0627\u0644\u064A\u0646 \u0628\u064A\u062F\u0642\u0643. \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0627\u0644\u0628\u0639\u064A\u062F\u0629 \u0645\u062E\u0641\u064A\u0629\u060C \u0648\u0627\u0644\u062E\u0635\u0645 \u062F\u0627\u064A\u0645\u064B\u0627 \u0638\u0627\u0647\u0631 \u0628\u062F\u0627\u064A\u0631\u0629 \u062D\u0645\u0631\u0627":"\u{1F32B}\uFE0F You see around your pawn. Far barriers are hidden, and the opponent always shows with a red circle","\u{1F32B}\uFE0F \u0634\u0627\u064A\u0641 \u0628\u0633 \u062D\u0648\u0627\u0644\u064A\u0646 \u0628\u064A\u062F\u0642\u0643. \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0648\u0627\u0644\u062E\u0635\u0645 \u0627\u0644\u0628\u0639\u064A\u062F\u064A\u0646 \u0645\u062E\u0641\u064A\u064A\u0646":"\u{1F32B}\uFE0F You only see around your pawn. Far barriers and the opponent are hidden","\u2022 \u0647\u062F\u0641\u0643 \u062A\u0648\u0635\u0644 \u0644\u0644\u0635\u0641 \u0627\u0644\u0644\u064A \u0641\u064A \u0648\u0634 \u0627\u0644\u062E\u0635\u0645 \u0642\u0628\u0644 \u0645\u0627 \u0647\u0648 \u064A\u0648\u0635\u0644 \u0644\u0635\u0641\u0643.":"\u2022 Your goal is to reach the row facing you before the opponent reaches yours.","\u0643\u0644 \u0645\u0627 \u062A\u0643\u0633\u0628 \u0628\u062A\u0627\u062E\u062F \u0639\u0645\u0644\u0627\u062A \u{1FA99} (\u0627\u0644\u0641\u0648\u0632 \u0623\u0643\u062A\u0631\u060C \u0648\u0627\u0644\u0623\u0648\u0646\u0644\u0627\u064A\u0646 \u0628\u0648\u0646\u0635)":"Every game earns coins \u{1FA99} (more for wins, online gives a bonus)","\u{1F30B} \u0627\u0644\u0645\u0631\u0628\u0639\u0627\u062A \u0627\u0644\u062D\u0645\u0631\u0627 \u0644\u0627\u0641\u0627: \u0645\u0645\u0646\u0648\u0639 \u062A\u062F\u0648\u0633 \u0639\u0644\u064A\u0647\u0627 \u0648\u0644\u0627 \u062A\u0639\u062F\u064A \u0645\u0646\u0647\u0627":"\u{1F30B} Red squares are lava: do not step on them or pass through","\u0627\u0644\u0643\u0648\u062F \u062F\u0647 \u0645\u0634 \u0645\u0648\u062C\u0648\u062F\u060C \u0623\u0648 \u0627\u0644\u063A\u0631\u0641\u0629 \u0627\u062A\u0642\u0641\u0644\u062A. \u0627\u062A\u0623\u0643\u062F \u0645\u0646 \u0627\u0644\u0643\u0648\u062F \u{1F642}":"That code does not exist or the room was closed. Check the code \u{1F642}","\u2022 \u0641\u064A \u0645\u0648\u062F \u0627\u0644\u0644\u0627\u0641\u0627 \u{1F30B} \u0627\u0644\u0628\u0644\u0648\u0643\u0627\u062A \u0627\u0644\u062D\u0645\u0631\u0627 \u0645\u0645\u0646\u0648\u0639 \u062A\u062F\u0648\u0633 \u0639\u0644\u064A\u0647\u0627.":"\u2022 In Lava mode \u{1F30B} you cannot step on the red blocks.","\u0634\u062E\u0635\u064A\u0627\u062A\u060C \u0645\u0648\u062F\u0627\u062A\u060C \u0648\u0645\u0633\u062A\u0648\u064A\u0627\u062A \u0635\u0639\u0648\u0628\u0629\u060C \u0643\u0644 \u062F\u0647 \u0641\u064A \u0644\u0639\u0628\u0629 \u0648\u0627\u062D\u062F\u0629":"Characters, modes and difficulty levels, all in one game","\u0645\u0642\u062F\u0631\u062A\u0634 \u0623\u0648\u0635\u0644 \u0644\u0644\u063A\u0631\u0641\u0629. \u0627\u062A\u0623\u0643\u062F \u0645\u0646 \u0627\u0644\u0643\u0648\u062F \u0648\u0627\u0644\u0646\u062A \u0648\u062C\u0631\u0628 \u062A\u0627\u0646\u064A":"Could not reach the room. Check the code and your internet, then try again","\u0628\u0644\u0648\u0643\u0627\u062A \u0644\u0627\u0641\u0627 \u0645\u0645\u0646\u0648\u0639 \u062A\u062F\u0648\u0633 \u0639\u0644\u064A\u0647\u0627\u060C \u0648\u0627\u0644\u0637\u0631\u064A\u0642 \u062F\u0627\u064A\u0645\u064B\u0627 \u0645\u0648\u062C\u0648\u062F":"Lava blocks are off limits, and a path always exists","\u0644\u0648 \u062F\u0633\u062A \u0639\u0644\u0649 \u0628\u0648\u0627\u0628\u0629 \u0628\u062A\u0646\u0642\u0644\u0643 \u0644\u0644\u0628\u0648\u0627\u0628\u0629 \u0627\u0644\u062A\u0627\u0646\u064A\u0629 \u0627\u0644\u0644\u064A \u0632\u064A\u0647\u0627":"Step on a portal and you jump to its twin","\u2022 \u0641\u064A \u0627\u0644\u0633\u0628\u0627\u0642 \u{1F3C1} \u0631\u0635\u064A\u062F \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0628\u064A\u0642\u0644 \u0644\u0648\u062D\u062F\u0647 \u0643\u0644 \u062C\u0648\u0644\u062A\u064A\u0646.":"\u2022 In Race \u{1F3C1} your barrier stock shrinks by itself every two rounds.","\u0627\u0644\u0644\u0639\u0628\u0629 \u0627\u0644\u0623\u0635\u0644\u064A\u0629: \u0623\u0648\u0635\u0644 \u0644\u0644\u0646\u0627\u062D\u064A\u0629 \u0627\u0644\u062A\u0627\u0646\u064A\u0629 \u0642\u0628\u0644 \u062E\u0635\u0645\u0643":"The original game: reach the other side before your opponent","\u{1F300} \u0627\u062F\u062E\u0644 \u0628\u0648\u0627\u0628\u0629 \u062A\u0637\u0644\u0639 \u0645\u0646 \u0627\u0644\u0628\u0648\u0627\u0628\u0629 \u0627\u0644\u0644\u064A \u0628\u0646\u0641\u0633 \u0627\u0644\u0644\u0648\u0646":"\u{1F300} Enter a portal and exit from the one with the same color","\u0645\u064A\u0646\u0641\u0639\u0634 \u062A\u062D\u0637 \u062D\u0627\u062C\u0632 \u0647\u0646\u0627\u060C \u0644\u0627\u0632\u0645 \u064A\u0641\u0636\u0644 \u0637\u0631\u064A\u0642 \u0645\u0641\u062A\u0648\u062D \u{1F6A7}":"You cannot place a barrier here, a path must stay open \u{1F6A7}","\u2728 \u0638\u0647\u0631 \u0645\u0631\u0628\u0639 \u0627\u0644\u062D\u0638! \u0627\u0644\u0644\u064A \u064A\u0648\u0635\u0644\u0647 \u0627\u0644\u0623\u0648\u0644 \u064A\u0627\u062E\u062F \u0642\u062F\u0631\u0629":"\u2728 The lucky square appeared! First to reach it gets a power","\u0631\u0635\u064A\u062F \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0628\u064A\u0642\u0644 \u0648\u0627\u062D\u062F \u0643\u0644 \u062C\u0648\u0644\u062A\u064A\u0646\u060C \u0644\u0627\u0632\u0645 \u062A\u0633\u0631\u0639":"Barrier stock drops by one every two rounds, hurry up","\u2022 \u0641\u064A \u0627\u0644\u0636\u0628\u0627\u0628 \u{1F32B}\uFE0F \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0627\u0644\u0628\u0639\u064A\u062F\u0629 \u0639\u0646\u0643 \u0628\u062A\u062E\u062A\u0641\u064A.":"\u2022 In Fog \u{1F32B}\uFE0F barriers far from you disappear.","\u0627\u0644\u0643\u0645\u0628\u064A\u0648\u062A\u0631 \u062D\u0637 \u062D\u0627\u062C\u0632 \u{1F6A7} .bd-host {
  --bg: #0b1220; --bg2: #111c33; --panel: #16223c; --panel2: #1d2c4d;
  --line: #2b3d63; --text: #e8eefc; --muted: #93a5cc; --accent: #4ade80;
  --accent2: #f59e0b; --danger: #f87171; --chip: #1a2742;
  --board-bg: #22335a; --board-cell: #2a3f6d; --board-cell2: #243763; --stud: #33507f;
  background: radial-gradient(1200px 600px at 50% -10%, #1b2c52 0%, var(--bg) 60%);
  color: var(--text); min-height: 100vh; direction: rtl;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.bd-host.bd-theme-light {
  --bg: #e9eefb; --bg2: #dde6f8; --panel: #ffffff; --panel2: #f0f4fd;
  --line: #c6d2ea; --text: #17233f; --muted: #5d6f95; --chip: #eef2fc;
  --board-bg: #b9c8e8; --board-cell: #c6d4f0; --board-cell2: #bccbee; --stud: #d3dff5;
  background: radial-gradient(1200px 600px at 50% -10%, #cdd9f4 0%, var(--bg) 60%);
}
.bd-host * { margin: 0; padding: 0; box-sizing: border-box; }
.bd-wrap { width: 100%; max-width: 560px; padding: 10px 12px 28px; display: flex; flex-direction: column; align-items: center; }
.bd-btn {
  font-family: inherit; font-weight: 700; color: var(--text);
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
  transition: transform .06s ease, filter .15s ease;
  min-height: 46px; padding: 10px 16px; font-size: 15px;
}
.bd-btn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.bd-btn.bd-on { background: linear-gradient(180deg, #3ddc84, #22c55e); color: #052e16; border-color: #16a34a; }
.bd-btn:disabled { opacity: .45; }
.bd-title { font-size: 34px; font-weight: 900; margin-top: 14px; letter-spacing: .5px;
  background: linear-gradient(90deg, #4ade80, #38bdf8, #f59e0b);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); text-align: center; }
.bd-sub { color: var(--muted); font-size: 14px; margin: 4px 0 14px; text-align: center; }
.bd-section { width: 100%; margin-bottom: 14px; }
.bd-label { font-size: 15px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
.bd-grid { display: grid; gap: 8px; }
.bd-g2 { grid-template-columns: 1fr 1fr; } .bd-g3 { grid-template-columns: 1fr 1fr 1fr; } .bd-g4 { grid-template-columns: 1fr 1fr; }
.bd-card {
  font-family: inherit; text-align: center; color: var(--text);
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px;
  cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25);
  transition: transform .08s ease, border-color .12s ease, box-shadow .12s ease;
}
.bd-card:active { transform: scale(.96); }
.bd-card.bd-on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,222,128,.25), 0 3px 0 rgba(0,0,0,.25); }
.bd-sw { display:flex; align-items:center; justify-content:center; width:100%; height:62px; border-radius:12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.25); }
.bd-swb { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; width:38px; height:38px; padding:3px; border-radius:6px; background:rgba(0,0,0,.35); }
.bd-swb i { display:block; border-radius:2px; }
.bd-card:has(.bd-sw) { padding:6px; }
.bd-card .em { font-size: 30px; line-height: 1.2; display: block; }
.bd-card .nm { font-weight: 800; font-size: 15px; display: block; margin-top: 2px; }
.bd-card .pk { color: var(--muted); font-size: 11.5px; display: block; margin-top: 3px; line-height: 1.35; }
.bd-card.bd-on .pk { color: var(--text); }
.bd-start {
  width: 100%; font-size: 20px; font-weight: 900; padding: 15px; margin-top: 6px;
  border-radius: 18px; border: none; color: #052e16; cursor: pointer;
  background: linear-gradient(180deg, #4ade80, #22c55e);
  box-shadow: 0 5px 0 #15803d, 0 10px 24px rgba(34,197,94,.35);
  font-family: inherit; min-height: 54px;
}
.bd-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #15803d; }
.bd-row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.bd-hud { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
.bd-pill { background: var(--chip); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 6px 10px; font-size: 12px; font-weight: 700; display: flex; gap: 5px; align-items: center; white-space: nowrap; }

  position: absolute; inset: 0; border-radius: 18px; z-index: 5;

}

.bd-modalwrap { position: fixed; inset: 0; z-index: 20; background: rgba(3,7,18,.66);
  display: flex; align-items: center; justify-content: center; padding: 16px; }

  border-radius: 20px; padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.5); animation: bd-fade .2s ease; }
.bd-modal h2 { font-size: 20px; margin-bottom: 12px; text-align: center; }
.bd-setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.bd-setrow:last-of-type { border-bottom: none; }
.bd-toggle { width: 58px; height: 32px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--chip); position: relative; cursor: pointer; transition: background .15s; }

  border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }

.bd-shake { animation:none !important; }
@keyframes bd-nudge { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-2px)} 70%{transform:translateX(2px)} }
.bd-help { width: 100%; background: var(--chip); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 10px 14px; font-size: 13.5px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }

  z-index: 30; animation: bd-fade .2s ease; }

  display: flex; flex-direction: column; gap: 2px; background: rgba(15,23,42,.94); color: #f8fafc; border: 2px solid #4ade80; border-radius: 16px;
  padding: 8px 16px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.45); animation: bd-chatpop-in .18s ease-out; transition: opacity .5s ease, transform .5s ease; }

  text-transform: uppercase; min-height: 54px; }

@media (min-width: 520px) { .bd-g4 { grid-template-columns: 1fr 1fr 1fr 1fr; } .bd-title { font-size: 40px; } }

/* ---- menu motion ---- */
@keyframes bd-screenin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---- chat + voice ---- */

  border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.5); animation: bd-sheet .28s cubic-bezier(.2,.8,.2,1) both; color: var(--text); }

.bd-cme { align-self: flex-start; background: #22c55e; color: #052e16; border-bottom-right-radius: 4px; }
.bd-cthem { align-self: flex-end; background: var(--panel2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

.bd-badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: #ef4444; color: #fff; font-size: 12px; line-height: 18px; }

/* ---- v3: top bar, language, coins ---- */
.bd-topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 4px; }
.bd-langbar { display: inline-flex; background: var(--chip); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.bd-lang { font-family: inherit; font-weight: 800; font-size: 13px; color: var(--muted); background: transparent; border: none; border-radius: 999px;
  padding: 6px 13px; cursor: pointer; min-height: 32px; transition: background-color .25s ease, color .25s ease, transform .15s ease; }

.bd-coinpill { font-family: inherit; font-weight: 900; font-size: 14px; color: #fde68a; cursor: pointer;

/* ---- turn timer ---- */
.bd-timer { position: relative; width: 100%; max-width: 360px; height: 22px; margin: 4px 0 2px; border-radius: 999px; overflow: hidden; visibility: hidden;
  background: var(--chip); border: 1.5px solid var(--line); }

.bd-chip { background: var(--chip); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 800; }

/* ---- bonus pick screen ---- */
.bd-pick { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px;
  background: radial-gradient(900px 500px at 50% 30%, rgba(34,52,96,.96), rgba(5,10,25,.97)); animation: bd-fade .3s ease both; overflow: hidden; }

  animation: bd-pcardin .8s cubic-bezier(.2,.9,.3,1.25) forwards, bd-pfloat 3s ease-in-out 1s infinite alternate; transition: transform .35s cubic-bezier(.2,.9,.3,1.4), opacity .35s ease, border-color .2s; }
@keyframes bd-pcardin { 0% { opacity: 0; transform: rotateY(90deg) translateY(40px) scale(.7); } 60% { opacity: 1; transform: rotateY(-8deg) translateY(-6px) scale(1.04); } 100% { opacity: 1; transform: none; } }

.bd-pglow { position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent 0 60%, rgba(250,204,21,.55) 80%, transparent 100%); animation: bd-spin 4s linear infinite; opacity: .55; }
.bd-pcard::after { content: ''; position: absolute; inset: 2px; border-radius: 20px; background: linear-gradient(170deg, #263a68, #162342); }
.bd-pcard > span:not(.bd-pglow) { position: relative; z-index: 1; }
.bd-pem { font-size: 56px; line-height: 1.1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
.bd-pnm { font-size: 18px; font-weight: 900; color: #fde68a; }
.bd-pds { font-size: 12.5px; color: #cbd5e1; line-height: 1.4; min-height: 36px; }
.bd-ptype { font-size: 11.5px; font-weight: 800; color: #7dd3fc; }
.bd-pcard:active { scale: .96; }
.bd-pcard.bd-chosen { animation: none; opacity: 1; transform: scale(1.1); border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.4), 0 0 40px rgba(74,222,128,.55); }
.bd-pcard.bd-notchosen { animation: none; opacity: .25; transform: scale(.88) translateY(14px); }
.bd-pickbar { position: relative; width: 100%; max-width: 420px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }

  background: repeating-conic-gradient(from 0deg, rgba(250,204,21,.6) 0 7deg, transparent 7deg 20deg); animation: bd-spin 7s linear infinite;

.bd-lem { font-size: 82px; line-height: 1.1; animation: bd-bounce .8s ease infinite alternate; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
.bd-lnm { font-size: 26px; font-weight: 900; color: #fde047; }
.bd-lds { font-size: 14px; margin-top: 4px; opacity: .9; }
.bd-lnote { margin-top: 8px; font-size: 12.5px; font-weight: 800; color: #7dd3fc; }
.bd-spark { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #fde047; box-shadow: 0 0 10px #facc15;
  opacity: 0; animation: bd-sparkfly 1.1s ease-out both; }
@keyframes bd-sparkfly { 0% { opacity: 1; transform: rotate(var(--a)) translateX(30px) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(calc(var(--d) + 120px)) scale(.2); } }

/* ---- shop ---- */
.bd-modal.bd-shop { max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.bd-snm { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.bd-buy { color: #fde68a; border-color: #a16207; }
.bd-setrow { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
.bd-modal h2 { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.bd-menutog { display:flex; gap:0; width:100%; margin:10px 0 4px; padding:3px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid var(--line); }
.bd-mt { flex:1; font-family:inherit; font-weight:800; font-size:13px; padding:8px 6px; border:none; border-radius:11px; background:transparent; color:var(--muted); cursor:pointer; }
.bd-mt.bd-on { background:linear-gradient(180deg,#3ddc84,#22c55e); color:#052e16; box-shadow:0 2px 0 rgba(0,0,0,.25); }

.rg-wrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden;color:#2b1a0c;font-family:'Noto Kufi Arabic','Geeza Pro','Segoe UI',Tahoma,Arial,sans-serif;
 background:radial-gradient(120% 90% at 50% 20%,#2f6b57 0%,#1f4a3c 55%,#0f271f 100%);user-select:none;-webkit-user-select:none;touch-action:manipulation}

 background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 6px)}

 background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),linear-gradient(rgba(255,170,90,.06),rgba(255,170,90,.06));
 animation:rg-flick 5s steps(1) infinite}
@keyframes rg-flick{0%,100%{opacity:1}47%{opacity:.93}48%{opacity:1}73%{opacity:.95}74%{opacity:1}}
/* menu */
.rg-menu{align-self:center;margin-top:auto;margin-bottom:auto;width:min(440px,92%);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;position:relative;z-index:2;animation:rg-rise .6s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rg-rise{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.rg-logo{font-size:clamp(38px,9vw,56px);font-weight:900;color:#f6e3b8;text-shadow:0 3px 0 #2a1608,0 8px 24px rgba(0,0,0,.6);letter-spacing:1px}
.rg-tag{color:#e9c58a;font-size:16px;margin-top:-6px}
.rg-stats{display:flex;gap:10px;width:100%}.rg-stats div{flex:1;background:rgba(20,10,4,.45);border:2px solid #c9a35a;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;gap:2px}
.rg-stats b{font-size:20px;color:#fde68a}.rg-stats span{font-size:12px;color:#d9b98a}
.rg-big{font:inherit;font-size:20px;font-weight:900;padding:14px 26px;border-radius:16px;border:0;cursor:pointer;color:#fff;background:linear-gradient(#3fae6a,#23804a);box-shadow:0 6px 0 #145a31,0 12px 22px rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s;min-width:210px}
.rg-big:active{transform:translateY(5px);box-shadow:0 1px 0 #145a31}
.rg-sec{font:inherit;font-size:15px;font-weight:800;padding:9px 18px;border-radius:12px;border:2px solid #c9a35a;cursor:pointer;color:#f6e3b8;background:rgba(20,10,4,.4)}
.rg-how{color:#d9b98a;font-size:14px;line-height:1.6;max-width:400px}
/* top bar */
.rg-top{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap;position:relative;z-index:3;background:linear-gradient(rgba(20,10,4,.65),rgba(20,10,4,.2))}
.rg-sp{flex:1}.rg-chip{background:rgba(255,240,210,.12);border:1.5px solid rgba(255,220,160,.35);color:#f6e3b8;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700;display:flex;gap:5px;align-items:center}
.rg-chip b{color:#fde68a;min-width:12px;display:inline-block}
.rg-heart{display:inline-block;width:14px;height:14px;background:#ef4444;clip-path:path('M7 13 C2 9 0 6 0 4 A3.5 3.5 0 0 1 7 3 A3.5 3.5 0 0 1 14 4 C14 6 12 9 7 13Z');transition:transform .3s,background .3s}
.rg-heart.x{background:#4b3a2a;transform:scale(.8)}
.rg-tb{font:inherit;font-size:13px;font-weight:800;padding:6px 11px;border-radius:10px;border:2px solid #c9a35a;background:#14382d;color:#f6e3b8;cursor:pointer}
.rg-tb.on{background:#c08a2a;color:#2a1608;border-color:#fde68a}
/* scene */
.rg-scene{position:relative;height:clamp(96px,17vh,170px);flex:none;overflow:hidden;z-index:2;background:linear-gradient(#d9ccaa,#b9a67c 70%,#9a8760);border-bottom:6px solid #2a1608}
.rg-win{position:absolute;inset:10px 8% 0;border:8px solid #3b2210;border-bottom:0;border-radius:14px 14px 0 0;background:linear-gradient(#cfe4ea,#9ab8c2 70%,#7d9aa4)}
.rg-win::before,.rg-win::after{content:'';position:absolute;top:0;bottom:0;width:6px;background:#3b2210;left:33%}.rg-win::after{left:66%}
.rg-cit{position:absolute;bottom:0;left:50%;width:clamp(66px,12.5vh,128px);margin-left:calc(clamp(66px,12.5vh,128px)/-2);transform:translateX(160%);opacity:0;z-index:2;transition:none}
.rg-cit.in{animation:rg-in .7s cubic-bezier(.2,.9,.3,1.05) forwards,rg-bob 2.4s .8s ease-in-out infinite}
.rg-cit.out{animation:rg-out .55s ease-in forwards}
@keyframes rg-in{from{transform:translateX(-170%);opacity:0}60%{opacity:1}to{transform:translateX(0);opacity:1}}
@keyframes rg-out{from{transform:translateX(0);opacity:1}to{transform:translateX(170%);opacity:0}}
@keyframes rg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.rg-face{width:100%;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.rg-eye{animation:rg-blink 4s infinite;transform-origin:center;transform-box:fill-box}@keyframes rg-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.rg-cit.happy .rg-mouth{d:path('M48 72 Q60 86 72 72')}.rg-cit.angry .rg-mouth{d:path('M50 78 Q60 70 70 78')}
.rg-cit.angry{animation:rg-bob .15s 4 !important}
.rg-bubble{position:absolute;top:10px;right:8%;max-width:40%;background:#fffdf5;border:3px solid #2a1608;border-radius:16px 16px 4px 16px;padding:6px 12px;font-size:clamp(13px,2.4vw,16px);font-weight:800;z-index:3;opacity:0;transform:scale(.6) translateY(10px);transform-origin:bottom right;transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1);min-height:34px}
.rg-bubble.on{opacity:1;transform:none}
.rg-counter{position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(#7a4a24,#4a2b15);border-top:4px solid #2a1608;z-index:3}
/* rules note */
.rg-note{position:relative;z-index:1;align-self:start;background:#fff0a0;color:#3a2a08;padding:14px 10px 10px;border-radius:3px 3px 12px 3px;box-shadow:0 8px 16px rgba(0,0,0,.4);transform:rotate(-2.2deg);font-size:12.5px;line-height:1.45;animation:rg-drop .7s .3s cubic-bezier(.2,1.3,.4,1) both;}
.rg-note.off{display:none}.rg-nt{font-weight:900;font-size:14px;margin-bottom:3px;border-bottom:2px dashed rgba(60,40,8,.4)}.rg-rule{margin:4px 0;padding-right:10px;position:relative}.rg-rule::before{content:'';position:absolute;right:0;top:7px;width:5px;height:5px;border-radius:50%;background:#b45309}
.rg-pin{position:absolute;top:-6px;left:50%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#b91c1c);box-shadow:0 3px 4px rgba(0,0,0,.5)}
@keyframes rg-drop{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}to{opacity:1;transform:rotate(-2.2deg)}}
/* desk */
.rg-desk{flex:1;min-height:0;position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,158px),1fr));gap:12px;align-items:start;padding:14px 10px 12px;overflow:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rg-desk.shake{animation:rg-shake .28s}
@keyframes rg-shake{0%,100%{transform:none}25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-2px,2px)}}
.rg-paper{min-width:0;position:relative;background:linear-gradient(#ffffff,#f7f3e6);border:1px solid rgba(0,0,0,.18);border-radius:4px;padding:10px 12px 12px;box-shadow:0 2px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.45);transform:rotate(var(--rot));font-size:15px;line-height:1.55;color:#2b2a5a;
 animation:rg-paper .55s var(--dl) cubic-bezier(.2,1,.3,1.1) both;transition:transform .2s,box-shadow .2s;cursor:pointer;
 background-image:linear-gradient(rgba(150,110,40,.08),rgba(150,110,40,.08)),radial-gradient(circle at 20% 10%,rgba(255,255,255,.6),transparent 40%)}
.rg-paper::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:4px;background:repeating-linear-gradient(0deg,rgba(120,80,20,.04) 0 2px,transparent 2px 5px)}
.rg-paper:hover,.rg-paper.top{transform:rotate(0) translateY(-5px) scale(1.03);z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.55)}
.rg-paper.away{animation:rg-away .45s ease-in forwards}
@keyframes rg-paper{from{opacity:0;transform:translateY(-90px) rotate(calc(var(--rot) * 4)) scale(.9)}to{opacity:1;transform:rotate(var(--rot))}}
@keyframes rg-away{to{opacity:0;transform:translateY(60px) rotate(8deg) scale(.9)}}
.rg-p-form{background-color:#fffef9}.rg-p-id{background-color:#e4f4e6}.rg-p-police{background-color:#e6ebfb}.rg-p-family{background-color:#fcefd9}.rg-p-birth{background-color:#fff9e6}
.rg-ph{text-align:center;font-weight:900;font-size:15px;color:#7a1c1c;border-bottom:2px double rgba(122,28,28,.5);margin-bottom:6px;padding-bottom:3px}
.rg-r{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted rgba(60,50,120,.25)}
.rg-r span{color:#5a4a2a;font-size:13px;font-weight:700;white-space:nowrap}.rg-r b{min-width:0;overflow-wrap:anywhere;font-weight:800;font-size:15px;color:#14206b;text-align:left;font-family:inherit}
.rg-fine{position:relative}.rg-fine b{font-size:10px;filter:blur(1px);opacity:.8;transition:all .25s;letter-spacing:.3px;display:inline-block;transform-origin:left center}
.rg-fine.lit b{font-size:15px;filter:none;opacity:1;transform:scale(1.05);color:#b00020;text-shadow:0 0 6px rgba(255,200,80,.9)}
.rg-line{font-size:12px;color:#444;margin:2px 0 4px;text-align:center}
.rg-barcode{position:absolute;left:12px;top:36px;width:54px;height:20px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px);opacity:.75}
.rg-reason{margin:6px 0 3px;font-weight:900;color:#7a1c1c;font-size:13px}
.rg-chks{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12px;color:#444}
.rg-chk{display:flex;align-items:center;gap:5px}.rg-chk i{width:12px;height:12px;border:2px solid #555;border-radius:2px;position:relative;display:inline-block}
.rg-chk.on i::after{content:'';position:absolute;left:1px;top:-4px;width:6px;height:11px;border:solid #1f2a7a;border-width:0 3px 3px 0;transform:rotate(40deg)}
.rg-stampslot{position:relative;height:50px;margin-top:4px}
.rg-idflex{display:flex;gap:8px;align-items:flex-start}.rg-idflex>div:last-child{flex:1}.rg-idphoto{width:48px;height:58px;border-radius:4px;background:linear-gradient(#c6d6c2,#8fa88b);border:2px solid #5d7a58;flex:none;position:relative;overflow:hidden}
.rg-idphoto::after{content:'';position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:#7a8f76;box-shadow:0 26px 0 6px #7a8f76}
.rg-seal{position:absolute;left:14px;bottom:10px;width:40px;height:40px;border-radius:50%;border:3px double rgba(30,60,140,.5);opacity:.6}.rg-seal2{border-color:rgba(140,30,30,.5)}
/* stamp mark */
.rg-mark{position:absolute;left:50%;top:50%;font-weight:900;font-size:26px;padding:3px 14px;border:4px solid;border-radius:8px;letter-spacing:1px;mix-blend-mode:multiply;opacity:.9;transform:translate(-50%,-50%) rotate(-12deg);animation:rg-slam .38s cubic-bezier(.2,1.5,.4,1) both;filter:blur(.3px)}
.rg-mark.ok{color:#15803d;border-color:#15803d}.rg-mark.no{color:#b91c1c;border-color:#b91c1c}
@keyframes rg-slam{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3.2);opacity:0}70%{transform:translate(-50%,-50%) rotate(-12deg) scale(.92);opacity:1}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:.9}}
.rg-ink{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:rg-spl .6s ease-out forwards}.rg-ink.ok{background:#15803d}.rg-ink.no{background:#b91c1c}
@keyframes rg-spl{from{transform:translate(0,0) scale(1);opacity:.9}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* bottom bar */
.rg-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:3;background:linear-gradient(rgba(20,10,4,.1),rgba(20,10,4,.7))}
.rg-stamp{font:inherit;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;cursor:pointer;padding:0;transition:transform .15s;min-width:104px}
.rg-stamp i{display:block;width:70px;height:34px;border-radius:10px 10px 4px 4px;position:relative}
.rg-stamp i::before{content:'';position:absolute;left:50%;top:-22px;width:26px;height:26px;margin-left:-13px;border-radius:50% 50% 6px 6px;background:#c9a35a;box-shadow:inset -4px -3px 0 rgba(0,0,0,.25)}
.rg-stamp b{display:block;width:104px;padding:9px 0;border-radius:8px;font-size:20px;color:#fff;margin-top:-2px;box-shadow:0 5px 0 rgba(0,0,0,.45),0 10px 18px rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s}
.rg-ok i{background:#15803d}.rg-ok b{background:#1fa34e}.rg-no i{background:#b91c1c}.rg-no b{background:#dc2626}
.rg-stamp:hover{transform:translateY(-4px)}.rg-stamp:active b{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.rg-stamp:active i{transform:translateY(5px)}
.rg-verdict{flex:1;text-align:center;font-weight:800;font-size:clamp(12px,3vw,16px);padding:8px 10px;border-radius:12px;opacity:0;transform:translateY(10px) scale(.9);transition:all .3s cubic-bezier(.2,1.4,.4,1);min-height:40px;display:flex;align-items:center;justify-content:center}
.rg-verdict.on{opacity:1;transform:none}.rg-verdict.good{background:rgba(34,197,94,.22);color:#bbf7d0;border:2px solid #22c55e}.rg-verdict.bad{background:rgba(239,68,68,.22);color:#fecaca;border:2px solid #ef4444}
.rg-hit::after{content:'';position:absolute;inset:0;z-index:80;pointer-events:none;box-shadow:inset 0 0 90px rgba(239,68,68,.65);animation:rg-hitf .5s forwards}@keyframes rg-hitf{from{opacity:1}to{opacity:0}}
/* score pop */
.rg-pop{direction:ltr;position:absolute;left:50%;top:48%;font-size:44px;font-weight:900;z-index:85;pointer-events:none;animation:rg-pop 1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.rg-pop.g{color:#86efac}.rg-pop.b{color:#fca5a5}@keyframes rg-pop{from{transform:translate(-50%,0) scale(.4);opacity:0}25%{transform:translate(-50%,-20px) scale(1.2);opacity:1}to{transform:translate(-50%,-90px) scale(1);opacity:0}}
/* lens */
.rg-lens{position:fixed;left:0;top:0;width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:95;opacity:0;border:7px solid #5b3a18;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,.08) 40%,rgba(180,220,255,.1));box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 0 18px rgba(255,255,255,.4);transition:opacity .2s}
.rg-lens::after{content:'';position:absolute;right:-26px;bottom:-26px;width:12px;height:38px;background:#5b3a18;border-radius:6px;transform:rotate(-45deg)}
.rg-lens.on{opacity:1}.rg-lensmode .rg-desk{cursor:none}
/* end */
.rg-end{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,5,2,.7);animation:rg-fade .3s both}@keyframes rg-fade{from{opacity:0}}
.rg-card{width:min(380px,92%);background:linear-gradient(#fbf0d2,#ecd9a8);border-radius:8px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-1deg);animation:rg-cardin .7s cubic-bezier(.2,1.2,.4,1) both;text-align:center;color:#2b1a0c;position:relative}
@keyframes rg-cardin{from{opacity:0;transform:translateY(80px) rotate(6deg) scale(.8)}to{opacity:1;transform:rotate(-1deg)}}
.rg-endt{font-size:30px;font-weight:900;animation:rg-slam2 .6s .3s cubic-bezier(.2,1.5,.4,1) both}.rg-endt.good{color:#15803d}.rg-endt.bad{color:#b91c1c}
@keyframes rg-slam2{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.rg-endsub{font-size:14px;color:#6b5a3a;margin-bottom:10px}
.rg-endrow{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dotted rgba(60,40,10,.4);font-size:17px;font-weight:700}.rg-endrow b{color:#1f2a7a}.rg-endrow.big{font-size:22px}.rg-endrow.big b{color:#b45309}
.rg-rank{margin:10px 0;font-size:15px}.rg-rank b{color:#7a1c1c;font-size:18px}
.rg-endbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.rg-endbtns .rg-big{min-width:150px;font-size:17px;padding:11px 18px}.rg-endbtns .rg-sec{color:#4a2b15;border-color:#c9a35a;background:rgba(255,255,255,.4)}
@media(max-width:560px){.rg-paper{font-size:11.5px;padding:8px 8px 10px}.rg-r span{font-size:10.5px}.rg-ph{font-size:13px}.rg-chip{font-size:12px;padding:3px 8px}.rg-tb{font-size:12px;padding:5px 8px}.rg-top{gap:4px;padding:6px 8px}.rg-mark{font-size:20px}.rg-chks{font-size:10.5px}.rg-note{font-size:11.5px}.rg-bubble{max-width:46%;right:4%}.rg-stamp{min-width:84px}.rg-stamp b{width:84px;font-size:17px}.rg-stamp i{width:56px}.rg-desk{padding-top:10px;gap:10px}}

.rg-mark{left:auto;top:auto}.rg-ink{left:auto;top:auto}
.rg-p-form.target{box-shadow:0 0 0 4px #fde68a,0 18px 34px rgba(0,0,0,.6);transform:rotate(0) translateY(-4px)}
.rg-stamp{touch-action:none}.rg-stamp.lifted{opacity:.35}
.rg-ghost{position:fixed;z-index:9999;pointer-events:none;width:104px;margin-left:-52px;margin-top:-46px;transform:translateY(0) scale(1) rotate(0);transition:transform .14s cubic-bezier(.2,1.5,.4,1),filter .14s,opacity .3s;filter:drop-shadow(0 6px 5px rgba(0,0,0,.35));display:flex;flex-direction:column;align-items:center}
.rg-ghost.held{transform:translateY(-16px) scale(1.12) rotate(-5deg);filter:drop-shadow(0 22px 14px rgba(0,0,0,.45))}
.rg-ghost.over{transform:translateY(-22px) scale(1.18) rotate(0)}
.rg-ghost.fly{transition:left .34s cubic-bezier(.3,.9,.3,1),top .34s cubic-bezier(.3,.9,.3,1),transform .2s}
.rg-ghost.back{opacity:0;transform:scale(.7)}
.rg-ghost.press{transform:translateY(10px) scale(.9,.82);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));transition:transform .09s ease-in,filter .09s}
.rg-ghost.lift{transform:translateY(-34px) scale(1.15);opacity:0;transition:transform .4s ease-out,opacity .4s}
.rg-gh-knob{width:30px;height:34px;border-radius:50% 50% 6px 6px;background:linear-gradient(90deg,#8a5a2e,#c08a50 45%,#6b4220);box-shadow:inset -4px -3px 0 rgba(0,0,0,.25)}
.rg-gh-body{margin-top:-2px;padding:9px 0;width:104px;text-align:center;border-radius:8px;color:#fff;font-weight:900;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.rg-ghost.ok .rg-gh-body{background:#1fa34e}.rg-ghost.no .rg-gh-body{background:#dc2626}
.rg-help{position:absolute;left:8px;top:58px;z-index:40;width:min(270px,70vw);background:#fffdf1;color:#2b1a0c;border:3px solid #c9a35a;border-radius:14px;padding:10px 12px;box-shadow:0 14px 30px rgba(0,0,0,.5);opacity:0;transform:translate(-20px,-10px) scale(.92);transform-origin:top left;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.3,.4,1);max-height:calc(100% - 140px);overflow:auto;direction:rtl}
.rg-help.on{opacity:1;transform:none;pointer-events:auto}
.rg-hh{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:16px;color:#7a1c1c;margin-bottom:4px}
.rg-hh button{font:inherit;font-size:20px;font-weight:900;border:0;background:#e9dcb4;border-radius:50%;width:28px;height:28px;cursor:pointer;color:#7a1c1c;line-height:1}
.rg-help ol{padding-right:20px;margin:0;font-size:13px;line-height:1.55;font-weight:700}.rg-help li{margin:4px 0}
.rg-onb{background:linear-gradient(#3b82f6,#1d4ed8);box-shadow:0 6px 0 #1e3a8a,0 12px 22px rgba(0,0,0,.4)}
.rg-onote{color:#fecaca;font-size:14px;opacity:0;transition:opacity .3s}.rg-onote.on{opacity:1}
.rg-small{font-size:clamp(30px,7vw,42px)}
.rg-code{font-size:52px;font-weight:900;letter-spacing:10px;color:#fde68a;background:rgba(0,0,0,.35);border:3px dashed #c9a35a;border-radius:16px;padding:6px 18px;direction:ltr;animation:rg-rise .5s both}
.rg-codein{font:inherit;font-size:34px;font-weight:900;letter-spacing:8px;text-align:center;text-transform:uppercase;width:240px;padding:8px;border-radius:14px;border:3px solid #c9a35a;background:#fffdf1;color:#14206b;direction:ltr}
.rg-oppbar{display:inline-block;width:70px;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;vertical-align:middle}
.rg-oppbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#22d3ee);transition:width .5s}
.rg-oppbar.big{display:block;width:100%;height:14px;margin-top:12px;background:rgba(0,0,0,.15)}
.rg-opp b{font-size:12px}.rg-sub2{font-size:12px;color:#6b5a3a;text-align:end;margin-bottom:4px}
.rg-cd{position:absolute;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;font-size:clamp(80px,22vw,180px);font-weight:900;color:#fde68a;text-shadow:0 6px 0 #0f271f,0 0 40px rgba(0,0,0,.6);background:rgba(8,20,15,.55);pointer-events:none}
.rg-cd.pop{animation:rg-cdp .75s ease-out}@keyframes rg-cdp{from{transform:scale(2.4);opacity:0}30%{opacity:1}to{transform:scale(1)}}
.rg-banner{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#b91c1c;color:#fff;font-weight:900;padding:9px 18px;border-radius:12px;z-index:70;box-shadow:0 6px 20px #0008;animation:rgBan 2.9s forwards;font-size:17px;text-align:center;max-width:92%}
.rg-banner.phone{background:#1d4ed8}
@keyframes rgBan{0%{opacity:0;margin-top:-18px}10%,85%{opacity:1;margin-top:0}100%{opacity:0}}
.rg-phone{position:absolute;top:112px;right:12px;z-index:65;background:#16a34a;color:#fff;border:0;border-radius:14px;padding:11px 15px;font:inherit;font-weight:900;font-size:15px;animation:rgRing .35s infinite;cursor:pointer;box-shadow:0 5px 0 #0b5d2a}
@keyframes rgRing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.rg-coll{position:absolute;bottom:118px;left:12px;z-index:65;background:#fff7e6;color:#2b1a0c;border:2px solid #c08a2a;border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:270px}
.rg-coll button{font:inherit;font-weight:900;border:0;border-radius:10px;padding:6px 12px;cursor:pointer;background:#3fae6a;color:#fff}.rg-coll button+button{background:#9ca3af}
.rg-brb{position:absolute;bottom:118px;right:12px;z-index:65;background:#7c2d12;color:#fde68a;border:2px solid #fbbf24;border-radius:12px;padding:9px 14px;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
.rg-cit.vip::after{content:'\u0646\u062C\u0645';position:absolute;top:-8px;right:-10px;background:#facc15;color:#000;font-weight:900;border-radius:10px;padding:2px 8px;font-size:13px}
.rg-insp .rg-win{box-shadow:inset 0 0 0 4px #ef4444,0 0 24px #ef4444aa}
.rg-roadbar{position:absolute;top:54px;left:8px;right:8px;height:10px;background:#1f2937;border-radius:8px;z-index:30}
.rg-car{position:absolute;top:-9px;left:0;background:#111;color:#facc15;font-size:12px;font-weight:900;padding:2px 9px;border-radius:7px;white-space:nowrap}
.rg-shop{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;color:#f6e3b8;font-weight:800;font-size:13px}.rg-shop .rg-sec{font-size:12px;padding:6px 10px}
.rg-rush,.rg-boss{font-size:16px;padding:11px 20px}.rg-boss{background:linear-gradient(#d14b3a,#a12d1f);box-shadow:0 6px 0 #6b1a10,0 12px 22px rgba(0,0,0,.4)}
.rg-menu{max-height:98vh;overflow-y:auto;gap:8px;scrollbar-width:none}.rg-menu::-webkit-scrollbar{display:none}.rg-rush,.rg-boss{font-size:14px;padding:8px 16px}.rg-menu .rg-big{font-size:18px;padding:10px 22px}.rg-logo{font-size:min(60px,9vh)}

.rg-paper.hand{animation:rg-hand .75s var(--dl) cubic-bezier(.2,.9,.3,1.08) both}
@keyframes rg-hand{0%{opacity:0;transform:translate(var(--hx),var(--hy)) rotate(calc(var(--rot) * 6)) scale(.45)}25%{opacity:1}100%{opacity:1;transform:rotate(var(--rot)) scale(1)}}
