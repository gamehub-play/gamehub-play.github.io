.bs-led circle { fill:var(--lc); opacity:.25; animation:bs-chase 1.1s linear infinite; filter:drop-shadow(0 0 3px var(--lc)); }
.bs-led.rb circle { fill:hsl(var(--hu,0) 95% 60%); animation:bs-chase 1.1s linear infinite, bs-hue 3s linear infinite; }
@keyframes bs-chase { 0%,100% { opacity:.2; } 25% { opacity:1; } 50% { opacity:.35; } }
@keyframes bs-hue { to { filter:hue-rotate(360deg) drop-shadow(0 0 3px #fff); } }
.bs-top .bs-mini { padding:4px 9px; font-size:12px; }
.bs-night { background:linear-gradient(#0d0830 0%,#2a0f55 62%,#10062a 100%); border-radius:16px; padding:6px 4px 14px; position:relative; overflow:hidden; box-shadow:inset 0 0 0 2px #7c3aed55; }
.bs-night .bs-sub { color:#d8c9ff; }
.bs-night::before { content:''; position:absolute; left:0; right:0; bottom:10px; height:54px; opacity:.9; pointer-events:none;
  background:
    linear-gradient(#22d3ee,#22d3ee) 6% 14px/3px 22px no-repeat, linear-gradient(#ff4fd8,#ff4fd8) 21% 6px/22px 3px no-repeat,
    linear-gradient(#a3e635,#a3e635) 38% 18px/3px 26px no-repeat, linear-gradient(#fb923c,#fb923c) 55% 10px/26px 3px no-repeat,
    linear-gradient(#ff4fd8,#ff4fd8) 72% 12px/3px 30px no-repeat, linear-gradient(#22d3ee,#22d3ee) 90% 8px/24px 3px no-repeat,
    repeating-linear-gradient(90deg,#1b0f4d 0 30px,#2c1a73 30px 48px,#150a3d 48px 64px);
  -webkit-mask:linear-gradient(transparent 0,#000 40%); mask:linear-gradient(transparent 0,#000 40%); filter:drop-shadow(0 0 5px #a855f7); animation:bs-sky 4s ease-in-out infinite alternate; }
@keyframes bs-sky { to { filter:drop-shadow(0 0 9px #22d3ee); } }
.bs-night::after { content:''; position:absolute; left:0; right:0; bottom:0; height:10px; background:repeating-linear-gradient(90deg,#fde68a 0 18px,transparent 18px 38px) 0 4px/200% 2px no-repeat,#15092f; animation:bs-road 1s linear infinite; pointer-events:none; }
@keyframes bs-road { to { background-position:-76px 4px,0 0; } }
.bs-night .bd-bus { position:relative; z-index:1; filter:drop-shadow(0 0 7px var(--glow,#a855f7)) drop-shadow(0 0 16px var(--glow,#a855f7)); }
.bs-night .bs-stars span.off { color:#4a3d70; }
.bs-bump { animation:bs-bump .38s ease-out; } @keyframes bs-bump { 30% { transform:translateY(-5px) scale(1.012,.985); } 60% { transform:translateY(1px) scale(.994,1.01); } }
.bs-rev { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; margin:6px 0 4px; max-height:30vh; overflow:auto; text-align:start; }
.bs-ri { display:flex; gap:6px; align-items:center; background:#fbf0cf; border:2px solid #3b3a4a; border-radius:10px; padding:3px 6px; opacity:0; animation:bs-rin .35s forwards; }
@keyframes bs-rin { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.bs-ri b { font-size:12px; } .bs-ri .st { color:#f59e0b; font-size:11px; letter-spacing:1px; white-space:nowrap; } .bs-ri .st i { font-style:normal; color:#cbb98a; } .bs-ri p { font-size:10.5px; line-height:1.25; color:#5a4d34; font-weight:700; }
.bs-avg { font-weight:900; font-size:13px; margin:2px 0; }
.bs-tkbar { height:12px; border-radius:8px; background:#e8d9ae; border:2px solid #3b3a4a; overflow:hidden; margin:4px 0; }
.bs-tkbar i { display:block; height:100%; background:linear-gradient(90deg,#f59e0b,#fbbf24); transition:width .8s cubic-bezier(.2,.9,.3,1.2); }
.bs-unlock { margin:6px auto; padding:6px 12px; border-radius:12px; background:#fff3c4; border:3px solid #f59e0b; font-weight:900; font-size:13px; animation:bs-pop .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes bs-pop { from { transform:scale(0) rotate(-8deg); } to { transform:none; } }
.bs-garage .bs-prev { background:#e8f3ec; border:3px solid #3b3a4a; border-radius:16px; padding:6px; margin:6px 0; }
.bs-garage .bs-prev.bs-night { padding:6px; }
.bs-garage .bd-bus { max-height:150px; margin:0 auto; width:auto; max-width:100%; }
.bs-gtabs { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:4px 0; }
.bs-gtabs button { font:inherit; font-weight:900; font-size:12px; padding:5px 10px; border-radius:12px; border:2.5px solid #3b3a4a; background:#fbf0cf; cursor:pointer; }
.bs-gtabs button.on { background:#86bb96; box-shadow:0 2px 0 #3b3a4a; }
.bs-glist { display:grid; grid-template-columns:1fr 1fr; gap:6px; max-height:26vh; overflow:auto; padding:2px; }
.bs-gi { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:12px; background:#fbf0cf; border:2.5px solid #3b3a4a; font:inherit; font-weight:800; font-size:12.5px; cursor:pointer; text-align:start; color:#2b2b2b; }
.bs-gi.eq { background:#a9d9b6; outline:3px solid #3b82f6; } .bs-gi.locked { opacity:.85; }
.bs-gi .sw { width:22px; height:22px; border-radius:50%; border:2.5px solid #3b3a4a; flex:none; }
.bs-gi small { display:block; font-size:10.5px; color:#6b5f48; }

d shapes in the shop.","\u0627\u0644\u0639\u0628 \u0645\u0639 \u0635\u0627\u062D\u0628\u0643\u060C \u0643\u0644 \u0648\u0627\u062D\u062F \u0639\u0644\u0649 \u0645\u0648\u0628\u0627\u064A\u0644\u0647\u060C \u0628\u0643\u0648\u062F \u063A\u0631\u0641\u0629. \u0641\u064A\u0647 \u0634\u0627\u062A \u0648\u0645\u064A\u0643 \u0643\u0645\u0627\u0646 \u{1F4AC}\u{1F3A4}":"Play with a friend, each on their own phone, using a room code. Chat and mic included \u{1F4AC}\u{1F3A4}","\u2022 \u0641\u064A \u0623\u0648\u0644 \u0643\u0644 \u0644\u0639\u0628\u0629 \u0628\u062A\u062E\u062A\u0627\u0631 \u0642\u062F\u0631\u0629 \u0645\u0646 \u0627\u062A\u0646\u064A\u0646\u060C \u0648\u0643\u0644 \u062F\u0648\u0631 \u0644\u064A\u0647 \u0648\u0642\u062A \u0645\u062D\u062F\u062F \u23F1\uFE0F.":"\u2022 At the start of every game you pick one of two powers, and every turn has a time limit \u23F1\uFE0F.","\u2022 \u0627\u0644\u062D\u0627\u062C\u0632 \u0645\u0645\u0646\u0648\u0639 \u064A\u0642\u0641\u0644 \u0627\u0644\u0637\u0631\u064A\u0642 \u062A\u0645\u0627\u0645\u064B\u0627\u060C \u0644\u0627\u0632\u0645 \u064A\u0641\u0636\u0644 \u0641\u064A \u0637\u0631\u064A\u0642 \u0645\u0641\u062A\u0648\u062D.":"\u2022 A barrier may never fully block the way; an open path must always remain.","\u0627\u0644\u062D\u0627\u062C\u0632 \u0628\u064A\u062A\u062D\u0637 \u0628\u0627\u0644\u0638\u0628\u0637 \u0639\u0646\u062F \u0627\u0644\u0646\u0642\u0637\u0629 \u0627\u0644\u0645\u0636\u064A\u0626\u0629\u060C \u062D\u0631\u0643 \u0635\u0628\u0627\u0639\u0643 \u0648\u0627\u0631\u0641\u0639\u0647 \u{1F3AF}":"The barrier lands exactly on the glowing dot. Slide your finger and lift \u{1F3AF}","\u0645\u0641\u064A\u0634 \u0625\u0630\u0646 \u0644\u0644\u0645\u064A\u0643. \u0641\u0639\u0651\u0644\u0647 \u0645\u0646 \u0625\u0639\u062F\u0627\u062F\u0627\u062A \u0627\u0644\u0645\u062A\u0635\u0641\u062D/\u0627\u0644\u0645\u0648\u0642\u0639 \u0648\u062C\u0631\u0628 \u062A\u0627\u0646\u064A":"No mic permission. Enable it in the browser/site settings and try again","\u0627\u0644\u0645\u064A\u0643 \u0634\u063A\u0627\u0644 \u{1F399}\uFE0F \u0635\u0627\u062D\u0628\u0643 \u0644\u0627\u0632\u0645 \u064A\u0641\u062A\u062D \u0627\u0644\u0645\u064A\u0643 \u0643\u0645\u0627\u0646 \u0639\u0634\u0627\u0646 \u062A\u0633\u0645\u0639\u0648\u0627 \u0628\u0639\u0636":"Mic is on \u{1F399}\uFE0F your friend must open their mic too so you can hear each other","\u{1F32B}\uFE0F \u0634\u0627\u064A\u0641 \u062D\u0648\u0627\u0644\u064A\u0646 \u0628\u064A\u062F\u0642\u0643. \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0627\u0644\u0628\u0639\u064A\u062F\u0629 \u0645\u062E\u0641\u064A\u0629\u060C \u0648\u0627\u0644\u062E\u0635\u0645 \u062F\u0627\u064A\u0645\u064B\u0627 \u0638\u0627\u0647\u0631 \u0628\u062F\u0627\u064A\u0631\u0629 \u062D\u0645\u0631\u0627":"\u{1F32B}\uFE0F You see around your pawn. Far barriers are hidden, and the opponent always shows with a red circle","\u{1F32B}\uFE0F \u0634\u0627\u064A\u0641 \u0628\u0633 \u062D\u0648\u0627\u0644\u064A\u0646 \u0628\u064A\u062F\u0642\u0643. \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0648\u0627\u0644\u062E\u0635\u0645 \u0627\u0644\u0628\u0639\u064A\u062F\u064A\u0646 \u0645\u062E\u0641\u064A\u064A\u0646":"\u{1F32B}\uFE0F You only see around your pawn. Far barriers and the opponent are hidden","\u2022 \u0647\u062F\u0641\u0643 \u062A\u0648\u0635\u0644 \u0644\u0644\u0635\u0641 \u0627\u0644\u0644\u064A \u0641\u064A \u0648\u0634 \u0627\u0644\u062E\u0635\u0645 \u0642\u0628\u0644 \u0645\u0627 \u0647\u0648 \u064A\u0648\u0635\u0644 \u0644\u0635\u0641\u0643.":"\u2022 Your goal is to reach the row facing you before the opponent reaches yours.","\u0643\u0644 \u0645\u0627 \u062A\u0643\u0633\u0628 \u0628\u062A\u0627\u062E\u062F \u0639\u0645\u0644\u0627\u062A \u{1FA99} (\u0627\u0644\u0641\u0648\u0632 \u0623\u0643\u062A\u0631\u060C \u0648\u0627\u0644\u0623\u0648\u0646\u0644\u0627\u064A\u0646 \u0628\u0648\u0646\u0635)":"Every game earns coins \u{1FA99} (more for wins, online gives a bonus)","\u{1F30B} \u0627\u0644\u0645\u0631\u0628\u0639\u0627\u062A \u0627\u0644\u062D\u0645\u0631\u0627 \u0644\u0627\u0641\u0627: \u0645\u0645\u0646\u0648\u0639 \u062A\u062F\u0648\u0633 \u0639\u0644\u064A\u0647\u0627 \u0648\u0644\u0627 \u062A\u0639\u062F\u064A \u0645\u0646\u0647\u0627":"\u{1F30B} Red squares are lava: do not step on them or pass through","\u0627\u0644\u0643\u0648\u062F \u062F\u0647 \u0645\u0634 \u0645\u0648\u062C\u0648\u062F\u060C \u0623\u0648 \u0627\u0644\u063A\u0631\u0641\u0629 \u0627\u062A\u0642\u0641\u0644\u062A. \u0627\u062A\u0623\u0643\u062F \u0645\u0646 \u0627\u0644\u0643\u0648\u062F \u{1F642}":"That code does not exist or the room was closed. Check the code \u{1F642}","\u2022 \u0641\u064A \u0645\u0648\u062F \u0627\u0644\u0644\u0627\u0641\u0627 \u{1F30B} \u0627\u0644\u0628\u0644\u0648\u0643\u0627\u062A \u0627\u0644\u062D\u0645\u0631\u0627 \u0645\u0645\u0646\u0648\u0639 \u062A\u062F\u0648\u0633 \u0639\u0644\u064A\u0647\u0627.":"\u2022 In Lava mode \u{1F30B} you cannot step on the red blocks.","\u0634\u062E\u0635\u064A\u0627\u062A\u060C \u0645\u0648\u062F\u0627\u062A\u060C \u0648\u0645\u0633\u062A\u0648\u064A\u0627\u062A \u0635\u0639\u0648\u0628\u0629\u060C \u0643\u0644 \u062F\u0647 \u0641\u064A \u0644\u0639\u0628\u0629 \u0648\u0627\u062D\u062F\u0629":"Characters, modes and difficulty levels, all in one game","\u0645\u0642\u062F\u0631\u062A\u0634 \u0623\u0648\u0635\u0644 \u0644\u0644\u063A\u0631\u0641\u0629. \u0627\u062A\u0623\u0643\u062F \u0645\u0646 \u0627\u0644\u0643\u0648\u062F \u0648\u0627\u0644\u0646\u062A \u0648\u062C\u0631\u0628 \u062A\u0627\u0646\u064A":"Could not reach the room. Check the code and your internet, then try again","\u0628\u0644\u0648\u0643\u0627\u062A \u0644\u0627\u0641\u0627 \u0645\u0645\u0646\u0648\u0639 \u062A\u062F\u0648\u0633 \u0639\u0644\u064A\u0647\u0627\u060C \u0648\u0627\u0644\u0637\u0631\u064A\u0642 \u062F\u0627\u064A\u0645\u064B\u0627 \u0645\u0648\u062C\u0648\u062F":"Lava blocks are off limits, and a path always exists","\u0644\u0648 \u062F\u0633\u062A \u0639\u0644\u0649 \u0628\u0648\u0627\u0628\u0629 \u0628\u062A\u0646\u0642\u0644\u0643 \u0644\u0644\u0628\u0648\u0627\u0628\u0629 \u0627\u0644\u062A\u0627\u0646\u064A\u0629 \u0627\u0644\u0644\u064A \u0632\u064A\u0647\u0627":"Step on a portal and you jump to its twin","\u2022 \u0641\u064A \u0627\u0644\u0633\u0628\u0627\u0642 \u{1F3C1} \u0631\u0635\u064A\u062F \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0628\u064A\u0642\u0644 \u0644\u0648\u062D\u062F\u0647 \u0643\u0644 \u062C\u0648\u0644\u062A\u064A\u0646.":"\u2022 In Race \u{1F3C1} your barrier stock shrinks by itself every two rounds.","\u0627\u0644\u0644\u0639\u0628\u0629 \u0627\u0644\u0623\u0635\u0644\u064A\u0629: \u0623\u0648\u0635\u0644 \u0644\u0644\u0646\u0627\u062D\u064A\u0629 \u0627\u0644\u062A\u0627\u0646\u064A\u0629 \u0642\u0628\u0644 \u062E\u0635\u0645\u0643":"The original game: reach the other side before your opponent","\u{1F300} \u0627\u062F\u062E\u0644 \u0628\u0648\u0627\u0628\u0629 \u062A\u0637\u0644\u0639 \u0645\u0646 \u0627\u0644\u0628\u0648\u0627\u0628\u0629 \u0627\u0644\u0644\u064A \u0628\u0646\u0641\u0633 \u0627\u0644\u0644\u0648\u0646":"\u{1F300} Enter a portal and exit from the one with the same color","\u0645\u064A\u0646\u0641\u0639\u0634 \u062A\u062D\u0637 \u062D\u0627\u062C\u0632 \u0647\u0646\u0627\u060C \u0644\u0627\u0632\u0645 \u064A\u0641\u0636\u0644 \u0637\u0631\u064A\u0642 \u0645\u0641\u062A\u0648\u062D \u{1F6A7}":"You cannot place a barrier here, a path must stay open \u{1F6A7}","\u2728 \u0638\u0647\u0631 \u0645\u0631\u0628\u0639 \u0627\u0644\u062D\u0638! \u0627\u0644\u0644\u064A \u064A\u0648\u0635\u0644\u0647 \u0627\u0644\u0623\u0648\u0644 \u064A\u0627\u062E\u062F \u0642\u062F\u0631\u0629":"\u2728 The lucky square appeared! First to reach it gets a power","\u0631\u0635\u064A\u062F \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0628\u064A\u0642\u0644 \u0648\u0627\u062D\u062F \u0643\u0644 \u062C\u0648\u0644\u062A\u064A\u0646\u060C \u0644\u0627\u0632\u0645 \u062A\u0633\u0631\u0639":"Barrier stock drops by one every two rounds, hurry up","\u2022 \u0641\u064A \u0627\u0644\u0636\u0628\u0627\u0628 \u{1F32B}\uFE0F \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0627\u0644\u0628\u0639\u064A\u062F\u0629 \u0639\u0646\u0643 \u0628\u062A\u062E\u062A\u0641\u064A.":"\u2022 In Fog \u{1F32B}\uFE0F barriers far from you disappear.","\u0627\u0644\u0643\u0645\u0628\u064A\u0648\u062A\u0631 \u062D\u0637 \u062D\u0627\u062C\u0632 \u{1F6A7} (\u0645\u0645\u0643\u0646 \u064A\u0643\u0648\u0646 \u0641\u064A \u0627\u0644\u0636\u0628\u0627\u0628)":"The computer placed a barrier \u{1F6A7} (maybe in the fog)","\u{1F50A} \u062F\u0648\u0633 \u0623\u064A \u0645\u0643\u0627\u0646 \u0639\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629 \u0639\u0634\u0627\u0646 \u062A\u0633\u0645\u0639 \u0635\u0627\u062D\u0628\u0643":"\u{1F50A} Tap anywhere on the screen to hear your friend","\u062A\u062D\u0637\u064A\u0645: \u0628\u064A\u0634\u064A\u0644 \u0622\u062E\u0631 \u062D\u0627\u062C\u0632\u064A\u0646 \u062D\u0637\u0647\u0645 \u0627\u0644\u062E\u0635\u0645 (\u0645\u0631\u0629)":"Smash: removes the last two barriers the opponent placed (once)","\u0628\u064A\u0637\u064A\u0651\u0631\u0643 \u0644\u062D\u062F \u0663 \u062E\u0637\u0648\u0627\u062A \u0642\u062F\u0627\u0645 \u0645\u0646 \u0641\u0648\u0642 \u0627\u0644\u062D\u0648\u0627\u062C\u0632":"Flies you up to 3 steps forward over barriers","\u0627\u0631\u0641\u0639 \u0635\u0628\u0627\u0639\u0643 \u0639\u0644\u0649 \u0627\u0644\u0645\u0631\u0628\u0639 \u0627\u0644\u0645\u0636\u064A\u0621 \u0639\u0634\u0627\u0646 \u062A\u062A\u062D\u0631\u0643":"Lift your finger on the glowing square to move","\u0627\u0644\u0645\u064A\u0643 \u062C\u0627\u0647\u0632 \u0648\u0647\u064A\u0634\u062A\u063A\u0644 \u0623\u0648\u0644 \u0645\u0627 \u0627\u0644\u0627\u062A\u0635\u0627\u0644 \u064A\u0631\u062C\u0639":"Mic is ready and will work when the connection returns","\u0644\u0648 \u062D\u0648\u0627\u062C\u0632\u0643 \u062E\u064 2 \u0632\u064A\u0627\u062F\u0629":"\u{1F48E} Every gem you take gives you an extra barrier","\u062A\u062E\u0637\u064A: \u062A\u0639\u062F\u064A \u0645\u0646 \u0641\u0648\u0642 \u062D\u0627\u062C\u0632 (\u0645\u0631\u0629 \u0648\u0627\u062D\u062F\u0629)":"Phase: pass over one barrier (once)","\u0627\u0646\u062F\u0641\u0627\u0639: \u062E\u0637\u0648\u062A\u064A\u0646 \u0641\u064A \u062E\u0637\u0648\u0629 (\u0645\u0631\u0629 \u0648\u0627\u062D\u062F\u0629)":"Dash: two steps in one move (once)","\u062A\u0628\u062F\u064A\u0644: \u0628\u062A\u0628\u062F\u0644 \u0645\u0643\u0627\u0646\u0643 \u0645\u0639 \u0627\u0644\u062E\u0635\u0645 (\u0645\u0631\u0629)":"Swap: switch places with the opponent (once)","\u{1F50A} \u062F\u0648\u0633 \u0639\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629 \u0639\u0634\u0627\u0646 \u062A\u0633\u0645\u0639 \u0635\u0627\u062D\u0628\u0643":"\u{1F50A} Tap the screen to hear your friend","\u0627\u0644\u0645\u0648\u062F (\u0627\u0644\u0644\u064A \u0628\u064A\u0639\u0645\u0644 \u0627\u0644\u063A\u0631\u0641\u0629 \u0628\u064A\u062E\u062A\u0627\u0631)":"Mode (the room creator chooses)","\u0627\u0644\u0633\u0628\u0627\u0642 \u0628\u064A\u0633\u0631\u0639! \u0631\u0635\u064A\u062F \u0627\u0644\u062D\u0648\u0627\u062C\u0632 \u0642\u0644 \u{1F3C1}":"The race speeds up! Barrier stock dropped \u{1F3C1}","\u0628\u064A\u062D\u0633\u0628 \u0643\u0644 \u062E\u0637\u0648\u0629 \u0648\u0628\u064A\u062D\u0637 \u062D\u0648\u0627\u062C\u0632 \u0630\u0643\u064A\u0629":"Calculates every step and places smart barriers","\u0627\u0644\u0643\u0648\u062F \u0644\u0627\u0632\u0645 \u064A\u0643\u0648\u0646 \u0665 \u062D\u0631\u0648\u0641/\u0623\u0631\u0642\u0627\u0645 \u{1F642}":"The code must be 5 letters/digits \u{1F642}","\u0627\u0644\u0627\u062A\u0635\u0627\u0644 \u0645\u0642\u0637\u0648\u0639\u060C \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0645\u062A\u0628\u0639\u062A\u062A\u0634":"Disconnected, the message was not sent","\u062E\u0637\u0648\u0629 \u0642\u062F\u0627\u0 .bd-host {
  --bg: #0b1220; --bg2: #111c33; --panel: #16223c; --panel2: #1d2c4d;
  --line: #2b3d63; --text: #e8eefc; --muted: #93a5cc; --accent: #4ade80;
  --accent2: #f59e0b; --danger: #f87171; --chip: #1a2742;
  --board-bg: #22335a; --board-cell: #2a3f6d; --board-cell2: #243763; --stud: #33507f;
  background: radial-gradient(1200px 600px at 50% -10%, #1b2c52 0%, var(--bg) 60%);
  color: var(--text); min-height: 100vh; direction: rtl;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.bd-host.bd-theme-light {
  --bg: #e9eefb; --bg2: #dde6f8; --panel: #ffffff; --panel2: #f0f4fd;
  --line: #c6d2ea; --text: #17233f; --muted: #5d6f95; --chip: #eef2fc;
  --board-bg: #b9c8e8; --board-cell: #c6d4f0; --board-cell2: #bccbee; --stud: #d3dff5;
  background: radial-gradient(1200px 600px at 50% -10%, #cdd9f4 0%, var(--bg) 60%);
}
.bd-host * { margin: 0; padding: 0; box-sizing: border-box; }
.bd-wrap { width: 100%; max-width: 560px; padding: 10px 12px 28px; display: flex; flex-direction: column; align-items: center; }
.bd-btn {
  font-family: inherit; font-weight: 700; color: var(--text);
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
  transition: transform .06s ease, filter .15s ease;
  min-height: 46px; padding: 10px 16px; font-size: 15px;
}
.bd-btn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.bd-btn.bd-on { background: linear-gradient(180deg, #3ddc84, #22c55e); color: #052e16; border-color: #16a34a; }
.bd-btn:disabled { opacity: .45; }
.bd-title { font-size: 34px; font-weight: 900; margin-top: 14px; letter-spacing: .5px;
  background: linear-gradient(90deg, #4ade80, #38bdf8, #f59e0b);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); text-align: center; }
.bd-sub { color: var(--muted); font-size: 14px; margin: 4px 0 14px; text-align: center; }
.bd-section { width: 100%; margin-bottom: 14px; }
.bd-label { font-size: 15px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
.bd-grid { display: grid; gap: 8px; }
.bd-g2 { grid-template-columns: 1fr 1fr; } .bd-g3 { grid-template-columns: 1fr 1fr 1fr; } .bd-g4 { grid-template-columns: 1fr 1fr; }
.bd-card {
  font-family: inherit; text-align: center; color: var(--text);
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px;
  cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25);
  transition: transform .08s ease, border-color .12s ease, box-shadow .12s ease;
}
.bd-card:active { transform: scale(.96); }
.bd-card.bd-on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,222,128,.25), 0 3px 0 rgba(0,0,0,.25); }
.bd-sw { display:flex; align-items:center; justify-content:center; width:100%; height:62px; border-radius:12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.25); }
.bd-swb { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; width:38px; height:38px; padding:3px; border-radius:6px; background:rgba(0,0,0,.35); }
.bd-swb i { display:block; border-radius:2px; }
.bd-card:has(.bd-sw) { padding:6px; }
.bd-card .em { font-size: 30px; line-height: 1.2; display: block; }
.bd-card .nm { font-weight: 800; font-size: 15px; display: block; margin-top: 2px; }
.bd-card .pk { color: var(--muted); font-size: 11.5px; display: block; margin-top: 3px; line-height: 1.35; }
.bd-card.bd-on .pk { color: var(--text); }
.bd-start {
  width: 100%; font-size: 20px; font-weight: 900; padding: 15px; margin-top: 6px;
  border-radius: 18px; border: none; color: #052e16; cursor: pointer;
  background: linear-gradient(180deg, #4ade80, #22c55e);
  box-shadow: 0 5px 0 #15803d, 0 10px 24px rgba(34,197,94,.35);
  font-family: inherit; min-height: 54px;
}
.bd-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #15803d; }
.bd-row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.bd-hud { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
.bd-pill { background: var(--chip); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 6px 10px; font-size: 12px; font-weight: 700; display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.bd-status { font-size: 17px; font-weight: 900; min-height: 26px; text-align: center; }
.bd-msg { color: var(--danger); font-size: 13.5px; min-height: 20px; text-align: center; font-weight: 700; }
.bd-boardwrap { position: relative; border-radius: 18px; padding: 8px;
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  border: 1.5px solid var(--line);
  box-shadow: 0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05); }
.bd-modehint { font-size: 12.5px; color: var(--muted); text-align: center; min-height: 18px; margin-bottom: 4px; font-weight: 700; }
@keyframes bd-pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
.bd-canvas { display: block; border-radius: 12px; touch-action: none; }
.bd-controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
.bd-iconbtn { min-width: 46px; padding: 10px 12px; }
.bd-overlay {
  position: absolute; inset: 0; border-radius: 18px; z-index: 5;
  background: rgba(5,10,25,.82); backdrop-filter: blur(3px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 18px; text-align: center; animation: bd-fade .25s ease;
}
.bd-host.bd-theme-light .bd-overlay { background: rgba(240,244,253,.85); }
@keyframes bd-fade { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.bd-wintitle { font-size: 30px; font-weight: 900; }
.bd-winsub { color: var(--muted); font-size: 14px; }
.bd-bigemoji { font-size: 56px; animation: bd-bounce 1s ease infinite alternate; }
@keyframes bd-bounce { from { transform: translateY(0);} to { transform: translateY(-10px);} }
.bd-modalwrap { position: fixed; inset: 0; z-index: 20; background: rgba(3,7,18,.66);
  display: flex; align-items: center; justify-content: center; padding: 16px; }
.bd-modal { width: 100%; max-width: 380px; background: var(--panel); border: 1.5px solid var(--line);
  border-radius: 20px; padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.5); animation: bd-fade .2s ease; }
.bd-modal h2 { font-size: 20px; margin-bottom: 12px; text-align: center; }
.bd-setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.bd-setrow:last-of-type { border-bottom: none; }
.bd-toggle { width: 58px; height: 32px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--chip); position: relative; cursor: pointer; transition: background .15s; }
.bd-toggle::after { content: ''; position: absolute; top: 3px; inset-inline-start: 4px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.bd-toggle.bd-on { background: #22c55e; border-color: #16a34a; }
.bd-toggle.bd-on::after { transform: translateX(-24px); background: #fff; }
.bd-shake { animation:none !important; }
@keyframes bd-nudge { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-2px)} 70%{transform:translateX(2px)} }
.bd-help { width: 100%; background: var(--chip); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 10px 14px; font-size: 13.5px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
.bd-help summary { cursor: pointer; font-weight: 800; color: var(--text); }
.bd-confetti { position: absolute; inset: 0; pointer-events: none; z-index: 6; border-radius: 18px; }
.bd-toast { position: fixed; bottom: 18px; inset-inline: 0; margin-inline: auto; width: max-content; max-width: 90%;
  background: var(--panel); border: 1.5px solid var(--line); color: var(--text); border-radius: 999px;
  padding: 9px 18px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  z-index: 30; animation: bd-fade .2s ease; }
.bd-chatpop { position: fixed; top: 14px; inset-inline: 0; margin-inline: auto; width: max-content; max-width: 88%; z-index: 40; pointer-events: none;
  display: flex; flex-direction: column; gap: 2px; background: rgba(15,23,42,.94); color: #f8fafc; border: 2px solid #4ade80; border-radius: 16px;
  padding: 8px 16px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.45); animation: bd-chatpop-in .18s ease-out; transition: opacity .5s ease, transform .5s ease; }
.bd-chatpop b { color: #4ade80; font-size: 12.5px; }
.bd-chatpop-out { opacity: 0; transform: translateY(-8px); }
@keyframes bd-chatpop-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
.bd-host[data-embed] .bd-chatpop { position: absolute; top: 60px; }
.bd-ghosthint { font-size: 12.5px; color: var(--muted); text-align: center; min-height: 18px; margin-top: 6px; font-weight: 700; }
.bd-code { font-size: 44px; font-weight: 900; letter-spacing: 8px; direction: ltr; text-align: center;
  background: var(--chip); border: 2px dashed var(--line); border-radius: 16px; padding: 10px 14px; user-select: all; -webkit-user-select: all; }
.bd-input { font-family: inherit; font-size: 28px; font-weight: 900; letter-spacing: 6px; text-align: center; direction: ltr;
  width: 100%; max-width: 220px; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--chip); color: var(--text);
  text-transform: uppercase; min-height: 54px; }
.bd-netmsg { font-size: 14px; font-weight: 800; text-align: center; color: var(--muted); min-height: 22px; margin: 8px 0; }
@media (min-width: 520px) { .bd-g4 { grid-template-columns: 1fr 1fr 1fr 1fr; } .bd-title { font-size: 40px; } }

/* ---- menu motion ---- */
@keyframes bd-screenin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes bd-titlein { from { opacity: 0; transform: scale(.8) translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes bd-cardin { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes bd-selpop { 0% { transform: scale(.92); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes bd-startglow { 0%,100% { box-shadow: 0 5px 0 #15803d, 0 10px 24px rgba(34,197,94,.30); } 50% { box-shadow: 0 5px 0 #15803d, 0 10px 34px rgba(34,197,94,.65); } }
/* press flash: green goes dark and fades back */
@keyframes bd-flashdark { 0% { filter: brightness(1); } 25% { filter: brightness(.3) saturate(.6); } 100% { filter: brightness(1); } }
@keyframes bd-ripple { to { transform: scale(1); opacity: 0; } }

/* ---- chat + voice ---- */
.bd-chat { position: fixed; inset-inline: 0; bottom: 0; margin-inline: auto; width: 100%; max-width: 560px; height: min(62vh, 480px); z-index: 30;
  flex-direction: column; gap: 8px; padding: 12px; background: var(--bg2); border: 2px solid var(--line); border-bottom: none;
  border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.5); animation: bd-sheet .28s cubic-bezier(.2,.8,.2,1) both; color: var(--text); }
@keyframes bd-sheet { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.bd-chathead { display: flex; align-items: center; justify-content: space-between; font-size: 16px; }
.bd-chathead .bd-iconbtn { min-height: 36px; padding: 4px 10px; }
.bd-voicerow { display: flex; gap: 8px; flex-wrap: wrap; }
.bd-voicerow .bd-btn { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.bd-voicenote { font-size: 12.5px; color: var(--muted); min-height: 16px; font-weight: 700; }
.bd-chatlog { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px; -webkit-overflow-scrolling: touch; }
.bd-cmsg { max-width: 82%; padding: 7px 11px; border-radius: 14px; font-size: 15px; line-height: 1.35; word-break: break-word; animation: bd-cardin .25s ease both; }
.bd-cme { align-self: flex-start; background: #22c55e; color: #052e16; border-bottom-right-radius: 4px; }
.bd-cthem { align-self: flex-end; background: var(--panel2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

/* ---- v3: top bar, language, coins ---- */

/* ---- turn timer ---- */
.bd-timer { position: relative; width: 100%; max-width: 360px; height: 22px; margin: 4px 0 2px; border-radius: 999px; overflow: hidden; visibility: hidden;
  background: var(--chip); border: 1.5px solid var(--line); }

/* ---- abilities row ---- */

.bd-chip { background: var(--chip); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 800; }

/* ---- bonus pick screen ---- */
.bd-pick { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px;
  background: radial-gradient(900px 500px at 50% 30%, rgba(34,52,96,.96), rgba(5,10,25,.97)); animation: bd-fade .3s ease both; overflow: hidden; }
.bd-pickrays { position: absolute; width: 900px; height: 900px; top: 50%; left: 50%; margin: -450px 0 0 -450px; pointer-events: none; opacity: .25;
  background: repeating-conic-gradient(from 0deg, rgba(250,204,21,.55) 0 8deg, transparent 8deg 24deg); animation: bd-spin 24s linear infinite;
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%); mask-image: radial-gradient(circle, #000 0%, transparent 62%); }
@keyframes bd-spin { to { transform: rotate(360deg); } }
.bd-picktitle { position: relative; font-size: 26px; font-weight: 900; color: #fde68a; text-align: center; text-shadow: 0 0 22px rgba(250,204,21,.6); animation: bd-titlein .6s cubic-bezier(.2,.9,.3,1.3) both; }
.bd-picksub { position: relative; color: #cbd5e1; font-size: 13px; text-align: center; font-weight: 700; }
.bd-pickcards { position: relative; display: flex; gap: 14px; width: 100%; max-width: 420px; justify-content: center; perspective: 900px; }
.bd-pcard { position: relative; flex: 1; min-width: 0; font-family: inherit; color: #f1f5f9; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  padding: 22px 10px 16px; border-radius: 22px; border: 2px solid #475d8f; background: linear-gradient(170deg, #263a68, #162342); overflow: hidden;

  animation: bd-pcardin .8s cubic-bezier(.2,.9,.3,1.25) forwards, bd-pfloat 3s ease-in-out 1s infinite alternate; transition: transform .35s cubic-bezier(.2,.9,.3,1.4), opacity .35s ease, border-color .2s; }

.bd-pglow { position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent 0 60%, rgba(250,204,21,.55) 80%, transparent 100%); animation: bd-spin 4s linear infinite; opacity: .55; }
.bd-pcard::after { content: ''; position: absolute; inset: 2px; border-radius: 20px; background: linear-gradient(170deg, #263a68, #162342); }

.bd-pem { font-size: 56px; line-height: 1.1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
.bd-pnm { font-size: 18px; font-weight: 900; color: #fde68a; }
.bd-pds { font-size: 12.5px; color: #cbd5e1; line-height: 1.4; min-height: 36px; }

.bd-pcard:active { scale: .96; }
.bd-pcard.bd-chosen { animation: none; opacity: 1; transform: scale(1.1); border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.4), 0 0 40px rgba(74,222,128,.55); }
.bd-pcard.bd-notchosen { animation: none; opacity: .25; transform: scale(.88) translateY(14px); }
.bd-pickbar { position: relative; width: 100%; max-width: 420px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
.bd-pickbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #facc15, #f97316); }
.bd-pickwait { position: relative; min-height: 20px; color: #cbd5e1; font-weight: 800; font-size: 14px; }

/* ---- lucky reveal ---- */
.bd-luckyshow { position: fixed; inset: 0; z-index: 26; display: flex; align-items: center; justify-content: center; pointer-events: auto; background: rgba(3,7,18,.55);
  animation: bd-luckyin .25s ease both, bd-luckyout .4s ease 2.4s forwards; }

@keyframes bd-luckyout { to { opacity: 0; } }
.bd-lrays { position: absolute; width: 760px; height: 760px; left: 50%; top: 50%; margin: -380px 0 0 -380px; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(250,204,21,.6) 0 7deg, transparent 7deg 20deg); animation: bd-spin 7s linear infinite;
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%); mask-image: radial-gradient(circle, #000 0%, transparent 60%); }
.bd-lcard { position: relative; text-align: center; padding: 24px 30px; border-radius: 26px; min-width: 240px; max-width: 86%; border: 3px solid #fbbf24;
  background: linear-gradient(170deg, #3b2f0b, #1c1505); color: #fef3c7; box-shadow: 0 0 60px rgba(250,204,21,.6), 0 20px 50px rgba(0,0,0,.6);
  animation: bd-lpop .7s cubic-bezier(.2,.9,.3,1.5) both; }

.bd-lem { font-size: 82px; line-height: 1.1; animation: bd-bounce .8s ease infinite alternate; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
.bd-lnm { font-size: 26px; font-weight: 900; color: #fde047; }
.bd-lds { font-size: 14px; margin-top: 4px; opacity: .9; }
.bd-lnote { margin-top: 8px; font-size: 12.5px; font-weight: 800; color: #7dd3fc; }
.bd-spark { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #fde047; box-shadow: 0 0 10px #facc15;
  opacity: 0; animation: bd-sparkfly 1.1s ease-out both; }
@keyframes bd-sparkfly { 0% { opacity: 1; transform: rotate(var(--a)) translateX(30px) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(calc(var(--d) + 120px)) scale(.2); } }

/* ---- shop ---- */
.bd-modal.bd-shop { max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.bd-shopcoins { text-align: center; font-size: 20px; font-weight: 900; color: #fde68a; margin-bottom: 6px; }

.bd-snm { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.bd-menutog { display:flex; gap:0; width:100%; margin:10px 0 4px; padding:3px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid var(--line); }
.bd-mt { flex:1; font-family:inherit; font-weight:800; font-size:13px; padding:8px 6px; border:none; border-radius:11px; background:transparent; color:var(--muted); cursor:pointer; }
.bd-mt.bd-on { background:linear-gradient(180deg,#3ddc84,#22c55e); color:#052e16; box-shadow:0 2px 0 rgba(0,0,0,.25); }
.bd-wrap.bd-new .bd-section { background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.1); border-radius:22px; padding:14px 12px 12px; box-shadow:0 10px 24px rgba(0,0,0,.28); }
.bd-wrap.bd-new .bd-label { font-size:13px; letter-spacing:.4px; color:var(--text); display:inline-block; padding:4px 12px; margin-bottom:10px; border-radius:999px; background:rgba(74,222,128,.14); border:1px solid rgba(74,222,128,.35); }
.bd-wrap.bd-new .bd-grid { gap:10px; }
.bd-wrap.bd-new .bd-card { border-radius:18px; border-width:1.5px; background:rgba(255,255,255,.05); box-shadow:none; padding:12px 8px; }
.bd-wrap.bd-new .bd-card.bd-on { background:linear-gradient(180deg,rgba(74,222,128,.28),rgba(34,197,94,.1)); border-color:#4ade80; box-shadow:0 0 0 2px rgba(74,222,128,.25), 0 6px 14px rgba(0,0,0,.3); }

.bd-hub { display:none; }

.bd-wrap.bd-new .bd-section { display:none; }
.bd-hubbtn { font-family:inherit; color:var(--text); display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:'e t g' 'e v g'; align-items:center; column-gap:10px; text-align:start; padding:14px 12px; border-radius:20px; border:1.5px solid rgba(148,163,184,.3); background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02)); cursor:pointer; }
.bd-hubbtn:active { transform:scale(.97); }
.bd-hubbtn .hem { grid-area:e; font-size:32px; }
.bd-hubbtn .ht { grid-area:t; font-size:12px; color:var(--muted); font-weight:800; }

.bd-wrap.bd-new .bd-start { font-size:24px; padding:18px; border-radius:28px; margin-top:14px; }
.bd-catview .bd-section { display:block; background:none; border:none; padding:0; }
.bd-catview .bd-label { display:none; }

.bd-splash { position:relative; align-items:center; text-align:center; min-height:560px; overflow:hidden; }
.bd-sp-bg { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.bd-sp-bg i { position:absolute; width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg,rgba(74,222,128,.35),rgba(56,189,248,.25)); animation:bd-float 7s ease-in-out infinite; }
.bd-sp-bg i:nth-child(1){left:8%;top:18%} .bd-sp-bg i:nth-child(2){left:78%;top:12%;animation-delay:-1.5s;width:34px;height:34px}
.bd-sp-bg i:nth-child(3){left:20%;top:62%;animation-delay:-3s;width:60px;height:60px} .bd-sp-bg i:nth-child(4){left:82%;top:55%;animation-delay:-4.5s}
.bd-sp-bg i:nth-child(5){left:50%;top:80%;animation-delay:-2s;width:30px;height:30px} .bd-sp-bg i:nth-child(6){left:60%;top:30%;animation-delay:-5.5s;width:26px;height:26px}
@keyframes bd-float { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-22px) rotate(14deg); } }
.bd-splash > *:not(.bd-sp-bg) { position:relative; z-index:1; }
.bd-sp-logo { font-size:84px; margin-top:26px; animation:bd-bob 3s ease-in-out infinite; filter:drop-shadow(0 8px 18px rgba(74,222,128,.45)); }
@keyframes bd-bob { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-8px) scale(1.06); } }
.bd-sp-title { font-size:44px; font-weight:900; background:linear-gradient(90deg,#4ade80,#38bdf8,#a78bfa,#4ade80); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:bd-shine 5s linear infinite; }
@keyframes bd-shine { to { background-position:300% 0; } }
.bd-sp-lvl { display:flex; align-items:center; gap:8px; margin:14px 0 8px; padding:8px 14px; border-radius:16px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); min-width:260px; }
.bd-sp-lvl .lv { font-weight:900; color:#fde68a; } .bd-sp-lvl .xp { font-size:11px; color:var(--muted); }
.bd-sp-lvl .bar { flex:1; height:8px; border-radius:6px; background:rgba(0,0,0,.35); overflow:hidden; } .bd-sp-lvl .bar i { display:block; height:100%; background:linear-gradient(90deg,#4ade80,#38bdf8); border-radius:6px; transition:width .6s ease; }
.bd-sp-name { font-family:inherit; font-size:15px; text-align:center; padding:10px 14px; width:min(260px,80%); border-radius:14px; border:1.5px solid rgba(148,163,184,.35); background:rgba(0,0,0,.25); color:var(--text); }
.bd-sp-go { font-family:inherit; margin:22px 0 16px; width:min(300px,86%); padding:20px; font-size:34px; font-weight:900; color:#052e16; border:none; border-radius:32px; cursor:pointer; background:linear-gradient(180deg,#86efac,#22c55e); box-shadow:0 8px 0 #15803d, 0 18px 34px rgba(34,197,94,.45); display:flex; align-items:center; justify-content:center; gap:12px; animation:bd-pulse 1.8s ease-in-out infinite; }
.bd-sp-go b { font-size:26px; display:inline-block; animation:bd-nudge 1.2s ease-in-out infinite; }
@keyframes bd-nudge { 0%,100% { transform:translateX(0); } 50% { transform:translateX(-7px); } }
@keyframes bd-pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.045); } }
.bd-sp-go:active { transform:translateY(5px) scale(.98); box-shadow:0 3px 0 #15803d; animation:none; }
.bd-sp-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:100%; max-width:430px; }
.bd-sp-tile { position:relative; font-family:inherit; font-size:12px; font-weight:800; color:var(--text); padding:12px 4px; border-radius:18px; border:1.5px solid rgba(148,163,184,.3); background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02)); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
.bd-sp-tile span { font-size:26px; } .bd-sp-tile:active { transform:scale(.95); }
.bd-dot { display:none; position:absolute; top:6px; left:8px; width:11px; height:11px; border-radius:50%; background:#f43f5e; box-shadow:0 0 0 3px rgba(244,63,94,.3); animation:bd-pulse 1.2s infinite; }
.bd-splash.bd-leave { position:absolute; inset:0; margin-left:auto; margin-right:auto; z-index:5; pointer-events:none; animation:none; }
.bd-splash.bd-leave > :not(.bd-warp) { visibility:hidden; }
.bd-splash.bd-leave .bd-warp .fill { animation:none; clip-path:circle(150% at var(--x) var(--y)); }
.bd-splash.bd-leave .bd-warp { animation:bd-warp-out .9s ease-in forwards; }
.bd-splash.bd-punch { pointer-events:none; }
.bd-splash.bd-punch > :not(.bd-warp):not(.bd-bgfx) { animation:bd-punch .55s cubic-bezier(.5,0,.8,.4) forwards; }
@keyframes bd-punch { 0% { transform:scale(1); } 20% { transform:scale(1.07); } 100% { transform:scale(.55); opacity:0; filter:blur(5px); } }
.bd-warp { position:absolute; inset:0; z-index:9; overflow:hidden; pointer-events:none; }
.bd-warp .r { position:absolute; left:var(--x); top:var(--y); width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; border:4px solid #4ade80; opacity:0; animation:bd-ring .8s ease-out forwards; }
.bd-warp .r2 { animation-delay:.12s; border-color:#38bdf8; } .bd-warp .r3 { animation-delay:.24s; border-color:#fde047; }
@keyframes bd-ring { 0% { transform:scale(.4); opacity:.95; } 100% { transform:scale(22); opacity:0; } }
