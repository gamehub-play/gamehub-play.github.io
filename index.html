.bd-host {
--bg: #0b1220; --bg2: #111c33; --panel: #16223c; --panel2: #1d2c4d;
--line: #2b3d63; --text: #e8eefc; --muted: #93a5cc; --accent: #4ade80;
--accent2: #f59e0b; --danger: #f87171; --chip: #1a2742;
--board-bg: #22335a; --board-cell: #2a3f6d; --board-cell2: #243763; --stud: #33507f;
background: radial-gradient(1200px 600px at 50% -10%, #1b2c52 0%, var(--bg) 60%);
color: var(--text); min-height: 100vh; direction: rtl;
font-family: "Segoe UI", Tahoma, Arial, sans-serif;
display: flex; flex-direction: column; align-items: center;
touch-action: manipulation; -webkit-user-select: none; user-select: none;
-webkit-tap-highlight-color: transparent;
}
.bd-host.bd-theme-light {
--bg: #e9eefb; --bg2: #dde6f8; --panel: #ffffff; --panel2: #f0f4fd;
--line: #c6d2ea; --text: #17233f; --muted: #5d6f95; --chip: #eef2fc;
--board-bg: #b9c8e8; --board-cell: #c6d4f0; --board-cell2: #bccbee; --stud: #d3dff5;
background: radial-gradient(1200px 600px at 50% -10%, #cdd9f4 0%, var(--bg) 60%);
}
.bd-host * { margin: 0; padding: 0; box-sizing: border-box; }
.bd-wrap { width: 100%; max-width: 560px; padding: 10px 12px 28px; display: flex; flex-direction: column; align-items: center; }
.bd-btn {
font-family: inherit; font-weight: 700; color: var(--text);
background: linear-gradient(180deg, var(--panel2), var(--panel));
border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer;
box-shadow: 0 3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
transition: transform .06s ease, filter .15s ease;
min-height: 46px; padding: 10px 16px; font-size: 15px;
}
.bd-btn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.bd-btn.bd-on { background: linear-gradient(180deg, #3ddc84, #22c55e); color: #052e16; border-color: #16a34a; }
.bd-btn:disabled { opacity: .45; }
.bd-title { font-size: 34px; font-weight: 900; margin-top: 14px; letter-spacing: .5px;
background: linear-gradient(90deg, #4ade80, #38bdf8, #f59e0b);
-webkit-background-clip: text; background-clip: text; color: transparent;
filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); text-align: center; }
.bd-sub { color: var(--muted); font-size: 14px; margin: 4px 0 14px; text-align: center; }
.bd-section { width: 100%; margin-bottom: 14px; }
.bd-label { font-size: 15px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
.bd-grid { display: grid; gap: 8px; }
.bd-g2 { grid-template-columns: 1fr 1fr; } .bd-g3 { grid-template-columns: 1fr 1fr 1fr; } .bd-g4 { grid-template-columns: 1fr 1fr; }
.bd-card {
font-family: inherit; text-align: center; color: var(--text);
background: linear-gradient(180deg, var(--panel2), var(--panel));
border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px;
cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25);
transition: transform .08s ease, border-color .12s ease, box-shadow .12s ease;
}
.bd-card:active { transform: scale(.96); }
.bd-card.bd-on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,222,128,.25), 0 3px 0 rgba(0,0,0,.25); }
.bd-sw { display:flex; align-items:center; justify-content:center; width:100%; height:62px; border-radius:12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.25); }
.bd-swb { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; width:38px; height:38px; padding:3px; border-radius:6px; background:rgba(0,0,0,.35); }
.bd-swb i { display:block; border-radius:2px; }
.bd-card:has(.bd-sw) { padding:6px; }
.bd-card .em { font-size: 30px; line-height: 1.2; display: block; }
.bd-card .nm { font-weight: 800; font-size: 15px; display: block; margin-top: 2px; }
.bd-card .pk { color: var(--muted); font-size: 11.5px; display: block; margin-top: 3px; line-height: 1.35; }
.bd-card.bd-on .pk { color: var(--text); }
.bd-start {
width: 100%; font-size: 20px; font-weight: 900; padding: 15px; margin-top: 6px;
border-radius: 18px; border: none; color: #052e16; cursor: pointer;
background: linear-gradient(180deg, #4ade80, #22c55e);
box-shadow: 0 5px 0 #15803d, 0 10px 24px rgba(34,197,94,.35);
font-family: inherit; min-height: 54px;
}
.bd-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #15803d; }
.bd-row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.bd-hud { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
.bd-pill { background: var(--chip); border: 1.5px solid var(--line); border-radius: 999px;
padding: 6px 10px; font-size: 12px; font-weight: 700; display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.bd-status { font-size: 17px; font-weight: 900; min-height: 26px; text-align: center; }
.bd-msg { color: var(--danger); font-size: 13.5px; min-height: 20px; text-align: center; font-weight: 700; }
.bd-boardwrap { position: relative; border-radius: 18px; padding: 8px;
background: linear-gradient(160deg, var(--panel2), var(--panel));
border: 1.5px solid var(--line);
box-shadow: 0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05); }
.bd-modehint { font-size: 12.5px; color: var(--muted); text-align: center; min-height: 18px; margin-bottom: 4px; font-weight: 700; }
@keyframes bd-pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
.bd-canvas { display: block; border-radius: 12px; touch-action: none; }
.bd-controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
.bd-iconbtn { min-width: 46px; padding: 10px 12px; }
.bd-overlay {
position: absolute; inset: 0; border-radius: 18px; z-index: 5;
background: rgba(5,10,25,.82); backdrop-filter: blur(3px);
display: flex; flex-direction: column; align-items: center; justify-content: center;
gap: 12px; padding: 18px; text-align: center; animation: bd-fade .25s ease;
}
.bd-host.bd-theme-light .bd-overlay { background: rgba(240,244,253,.85); }
@keyframes bd-fade { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.bd-wintitle { font-size: 30px; font-weight: 900; }
.bd-winsub { color: var(--muted); font-size: 14px; }
.bd-bigemoji { font-size: 56px; animation: bd-bounce 1s ease infinite alternate; }
@keyframes bd-bounce { from { transform: translateY(0);} to { transform: translateY(-10px);} }
.bd-modalwrap { position: fixed; inset: 0; z-index: 20; background: rgba(3,7,18,.66);

.rg-top{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap;position:relative;z-index:3;background:linear-gradient(rgba(20,10,4,.65),rgba(20,10,4,.2))}
.rg-sp{flex:1}.rg-chip{background:rgba(255,240,210,.12);border:1.5px solid rgba(255,220,160,.35);color:#f6e3b8;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700;display:flex;gap:5px;align-items:center}
.rg-chip b{color:#fde68a;min-width:12px;display:inline-block}
.rg-heart{display:inline-block;width:14px;height:14px;background:#ef4444;clip-path:path('M7 13 C2 9 0 6 0 4 A3.5 3.5 0 0 1 7 3 A3.5 3.5 0 0 1 14 4 C14 6 12 9 7 13Z');transition:transform .3s,background .3s}
.rg-heart.x{background:#4b3a2a;transform:scale(.8)}
.rg-tb{font:inherit;font-size:13px;font-weight:800;padding:6px 11px;border-radius:10px;border:2px solid #c9a35a;background:#14382d;color:#f6e3b8;cursor:pointer}
.rg-tb.on{background:#c08a2a;color:#2a1608;border-color:#fde68a}
/* scene */
.rg-scene{position:relative;height:clamp(96px,17vh,170px);flex:none;overflow:hidden;z-index:2;background:linear-gradient(#d9ccaa,#b9a67c 70%,#9a8760);border-bottom:6px solid #2a1608}
.rg-win{position:absolute;inset:10px 8% 0;border:8px solid #3b2210;border-bottom:0;border-radius:14px 14px 0 0;background:linear-gradient(#cfe4ea,#9ab8c2 70%,#7d9aa4)}
.rg-win::before,.rg-win::after{content:'';position:absolute;top:0;bottom:0;width:6px;background:#3b2210;left:33%}.rg-win::after{left:66%}
.rg-cit{position:absolute;bottom:0;left:50%;width:clamp(66px,12.5vh,128px);margin-left:calc(clamp(66px,12.5vh,128px)/-2);transform:translateX(160%);opacity:0;z-index:2;transition:none}
.rg-cit.in{animation:rg-in .7s cubic-bezier(.2,.9,.3,1.05) forwards,rg-bob 2.4s .8s ease-in-out infinite}
.rg-cit.out{animation:rg-out .55s ease-in forwards}
@keyframes rg-in{from{transform:translateX(-170%);opacity:0}60%{opacity:1}to{transform:translateX(0);opacity:1}}
@keyframes rg-out{from{transform:translateX(0);opacity:1}to{transform:translateX(170%);opacity:0}}
@keyframes rg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.rg-face{width:100%;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.rg-eye{animation:rg-blink 4s infinite;transform-origin:center;transform-box:fill-box}@keyframes rg-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.rg-cit.happy .rg-mouth{d:path('M48 72 Q60 86 72 72')}.rg-cit.angry .rg-mouth{d:path('M50 78 Q60 70 70 78')}
.rg-cit.angry{animation:rg-bob .15s 4 !important}
.rg-bubble{position:absolute;top:10px;right:8%;max-width:40%;background:#fffdf5;border:3px solid #2a1608;border-radius:16px 16px 4px 16px;padding:6px 12px;font-size:clamp(13px,2.4vw,16px);font-weight:800;z-index:3;opacity:0;transform:scale(.6) translateY(10px);transform-origin:bottom right;transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1);min-height:34px}
.rg-bubble.on{opacity:1;transform:none}
.rg-counter{position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(#7a4a24,#4a2b15);border-top:4px solid #2a1608;z-index:3}
/* rules note */
.rg-note{position:relative;z-index:1;align-self:start;background:#fff0a0;color:#3a2a08;padding:14px 10px 10px;border-radius:3px 3px 12px 3px;box-shadow:0 8px 16px rgba(0,0,0,.4);transform:rotate(-2.2deg);font-size:12.5px;line-height:1.45;animation:rg-drop .7s .3s cubic-bezier(.2,1.3,.4,1) both;}
.rg-note.off{display:none}.rg-nt{font-weight:900;font-size:14px;margin-bottom:3px;border-bottom:2px dashed rgba(60,40,8,.4)}.rg-rule{margin:4px 0;padding-right:10px;position:relative}.rg-rule::before{content:'';position:absolute;right:0;top:7px;width:5px;height:5px;border-radius:50%;background:#b45309}
.rg-pin{position:absolute;top:-6px;left:50%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#b91c1c);box-shadow:0 3px 4px rgba(0,0,0,.5)}
@keyframes rg-drop{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}to{opacity:1;transform:rotate(-2.2deg)}}
/* desk */
.rg-desk{flex:1;min-height:0;position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,158px),1fr));gap:12px;align-items:start;padding:14px 10px 12px;overflow:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rg-desk.shake{animation:rg-shake .28s}
@keyframes rg-shake{0%,100%{transform:none}25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-2px,2px)}}
.rg-paper{min-width:0;position:relative;background:linear-gradient(#ffffff,#f7f3e6);border:1px solid rgba(0,0,0,.18);border-radius:4px;padding:10px 12px 12px;box-shadow:0 2px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.45);transform:rotate(var(--rot));font-size:15px;line-height:1.55;color:#2b2a5a;
animation:rg-paper .55s var(--dl) cubic-bezier(.2,1,.3,1.1) both;transition:transform .2s,box-shadow .2s;cursor:pointer;
background-image:linear-gradient(rgba(150,110,40,.08),rgba(150,110,40,.08)),radial-gradient(circle at 20% 10%,rgba(255,255,255,.6),transparent 40%)}
.rg-paper::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:4px;background:repeating-linear-gradient(0deg,rgba(120,80,20,.04) 0 2px,transparent 2px 5px)}
.rg-paper:hover,.rg-paper.top{transform:rotate(0) translateY(-5px) scale(1.03);z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.55)}
.rg-paper.away{animation:rg-away .45s ease-in forwards}
@keyframes rg-paper{from{opacity:0;transform:translateY(-90px) rotate(calc(var(--rot) * 4)) scale(.9)}to{opacity:1;transform:rotate(var(--rot))}}
@keyframes rg-away{to{opacity:0;transform:translateY(60px) rotate(8deg) scale(.9)}}
.rg-p-form{background-color:#fffef9}.rg-p-id{background-color:#e4f4e6}.rg-p-police{background-color:#e6ebfb}.rg-p-family{background-color:#fcefd9}.rg-p-birth{background-color:#fff9e6}
.rg-ph{text-align:center;font-weight:900;font-size:15px;color:#7a1c1c;border-bottom:2px double rgba(122,28,28,.5);margin-bottom:6px;padding-bottom:3px}
.rg-r{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted rgba(60,50,120,.25)}
.rg-r span{color:#5a4a2a;font-size:13px;font-weight:700;white-space:nowrap}.rg-r b{min-width:0;overflow-wrap:anywhere;font-weight:800;font-size:15px;color:#14206b;text-align:left;font-family:inherit}
.rg-fine{position:relative}.rg-fine b{font-size:10px;filter:blur(1px);opacity:.8;transition:all .25s;letter-spacing:.3px;display:inline-block;transform-origin:left center}
.rg-fine.lit b{font-size:15px;filter:none;opacity:1;transform:scale(1.05);color:#b00020;text-shadow:0 0 6px rgba(255,200,80,.9)}
.rg-line{font-size:12px;color:#444;margin:2px 0 4px;text-align:center}
.rg-barcode{position:absolute;left:12px;top:36px;width:54px;height:20px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px);opacity:.75}
.rg-reason{margin:6px 0 3px;font-weight:900;color:#7a1c1c;font-size:13px}
.rg-chks{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12px;color:#444}
.rg-chk{display:flex;align-items:center;gap:5px}.rg-chk i{width:12px;height:12px;border:2px solid #555;border-radius:2px;position:relative;display:inline-block}
.rg-chk.on i::after{content:'';position:absolute;left:1px;top:-4px;width:6px;height:11px;border:solid #1f2a7a;border-width:0 3px 3px 0;transform:rotate(40deg)}
.rg-stampslot{position:relative;height:50px;margin-top:4px}
.rg-idflex{display:flex;gap:8px;align-items:flex-start}.rg-idflex>div:last-child{flex:1}.rg-idphoto{width:48px;height:58px;border-radius:4px;background:linear-gradient(#c6d6c2,#8fa88b);border:2px solid #5d7a58;flex:none;position:relative;overflow:hidden}
.rg-idphoto::after{content:'';position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:#7a8f76;box-shadow:0 26px 0 6px #7a8f76}
.rg-seal{position:absolute;left:14px;bottom:10px;width:40px;height:40px;border-radius:50%;border:3px double rgba(30,60,140,.5);opacity:.6}.rg-seal2{border-color:rgba(140,30,30,.5)}
/* stamp mark */
.rg-mark{position:absolute;left:50%;top:50%;font-weight:900;font-size:26px;padding:3px 14px;border:4px solid;border-radius:8px;letter-spacing:1px;mix-blend-mode:multiply;opacity:.9;transform:translate(-50%,-50%) rotate(-12deg);animation:rg-slam .38s cubic-bezier(.2,1.5,.4,1) both;filter:blur(.3px)}
.rg-mark.ok{color:#15803d;border-color:#15803d}.rg-mark.no{color:#b91c1c;border-color:#b91c1c}
@keyframes rg-slam{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3.2);opacity:0}70%{transform:translate(-50%,-50%) rotate(-12deg) scale(.92);opacity:1}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:.9}}
.rg-ink{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:rg-spl .6s ease-out forwards}.rg-ink.ok{background:#15803d}.rg-ink.no{background:#b91c1c}
@keyframes rg-spl{from{transform:translate(0,0) scale(1);opacity:.9}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* bottom bar */
.rg-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:3;background:linear-gradient(rgba(20,10,4,.1),rgba(20,10,4,.7))}
.rg-stamp{font:inherit;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;cursor:pointer;padding:0;transition:transform .15s;min-width:104px}
.rg-stamp i{display:block;width:70px;height:34px;border-radius:10px 10px 4px 4px;position:relative}
.rg-stamp i::before{content:'';position:absolute;left:50%;top:-22px;width:26px;height:26px;margin-left:-13px;border-radius:50% 50% 6px 6px;background:#c9a35a;box-shadow:inset -4px -3px 0 rgba(0,0,0,.25)}
.rg-stamp b{display:block;width:104px;padding:9px 0;border-radius:8px;font-size:20px;color:#fff;margin-top:-2px;box-shadow:0 5px 0 rgba(0,0,0,.45),0 10px 18px rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s}
.rg-ok i{background:#15803d}.rg-ok b{background:#1fa34e}.rg-no i{background:#b91c1c}.rg-no b{background:#dc2626}
.rg-stamp:hover{transform:translateY(-4px)}.rg-stamp:active b{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.rg-stamp:active i{transform:translateY(5px)}
.rg-verdict{flex:1;text-align:center;font-weight:800;font-size:clamp(12px,3vw,16px);padding:8px 10px;border-radius:12px;opacity:0;transform:translateY(10px) scale(.9);transition:all .3s cubic-bezier(.2,1.4,.4,1);min-height:40px;display:flex;align-items:center;justify-content:center}
.rg-verdict.on{opacity:1;transform:none}.rg-verdict.good{background:rgba(34,197,94,.22);color:#bbf7d0;border:2px solid #22c55e}.rg-verdict.bad{background:rgba(239,68,68,.22);color:#fecaca;border:2px solid #ef4444}
.rg-hit::after{content:'';position:absolute;inset:0;z-index:80;pointer-events:none;box-shadow:inset 0 0 90px rgba(239,68,68,.65);animation:rg-hitf .5s forwards}@keyframes rg-hitf{from{opacity:1}to{opacity:0}}
/* score pop */
.rg-pop{direction:ltr;position:absolute;left:50%;top:48%;font-size:44px;font-weight:900;z-index:85;pointer-events:none;animation:rg-pop 1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.rg-pop.g{color:#86efac}.rg-pop.b{color:#fca5a5}@keyframes rg-pop{from{transform:translate(-50%,0) scale(.4);opacity:0}25%{transform:translate(-50%,-20px) scale(1.2);opacity:1}to{transform:translate(-50%,-90px) scale(1);opacity:0}}
/* lens */
.rg-lens{position:fixed;left:0;top:0;width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:95;opacity:0;border:7px solid #5b3a18;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,.08) 40%,rgba(180,220,255,.1));box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 0 18px rgba(255,255,255,.4);transition:opacity .2s}
.rg-lens::after{content:'';position:absolute;right:-26px;bottom:-26px;width:12px;height:38px;background:#5b3a18;border-radius:6px;transform:rotate(-45deg)}
.rg-lens.on{opacity:1}.rg-lensmode .rg-desk{cursor:none}
/* end */
.rg-end{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,5,2,.7);animation:rg-fade .3s both}@keyframes rg-fade{from{opacity:0}}
.rg-card{width:min(380px,92%);background:linear-gradient(#fbf0d2,#ecd9a8);border-radius:8px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-1deg);animation:rg-cardin .7s cubic-bezier(.2,1.2,.4,1) both;text-align:center;color:#2b1a0c;position:relative}
@keyframes rg-cardin{from{opacity:0;transform:translateY(80px) rotate(6deg) scale(.8)}to{opacity:1;transform:rotate(-1deg)}}
.rg-endt{font-size:30px;font-weight:900;animation:rg-slam2 .6s .3s cubic-bezier(.2,1.5,.4,1) both}.rg-endt.good{color:#15803d}.rg-endt.bad{color:#b91c1c}
@keyframes rg-slam2{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.rg-endsub{font-size:14px;color:#6b5a3a;margin-bottom:10px}
.rg-endrow{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dotted rgba(60,40,10,.4);font-size:17px;font-weight:700}.rg-endrow b{color:#1f2a7a}.rg-endrow.big{font-size:22px}.rg-endrow.big b{color:#b45309}

.rg-endbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.rg-endbtns .rg-big{min-width:150px;font-size:17px;padding:11px 18px}.rg-endbtns .rg-sec{color:#4a2b15;border-color:#c9a35a;background:rgba(255,255,255,.4)}
@media(max-width:560px){.rg-paper{font-size:11.5px;padding:8px 8px 10px}.rg-r span{font-size:10.5px}.rg-ph{font-size:13px}.rg-chip{font-size:12px;padding:3px 8px}.rg-tb{font-size:12px;padding:5px 8px}.rg-top{gap:4px;padding:6px 8px}.rg-mark{font-size:20px}.rg-chks{font-size:10.5px}.rg-note{font-size:11.5px}.rg-bubble{max-width:46%;right:4%}.rg-stamp{min-width:84px}.rg-stamp b{width:84px;font-size:17px}.rg-stamp i{width:56px}.rg-desk{padding-top:10px;gap:10px}}
